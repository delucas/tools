<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Lucas Videla">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%26%23x1f6d2%3B%3C/text%3E%3C/svg%3E">
  <title>Compra-o-matic</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <style>
    .quantity-input {
      max-width: 4.5rem;
    }

    .drag-handle {
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .sortable-ghost {
      opacity: 0.45;
    }

    #lists .list-group-item {
      text-align: left;
    }

    .signature {
      font-size: 0.8em;
    }
  </style>
</head>
<body>
  <main class="container py-4">
    <a href="../" class="d-inline-block mb-2 text-body-secondary small text-decoration-none">← Todas las herramientas</a>

    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">Compra-o-matic</h1>
        <p class="text-body-secondary mb-0">Armá y ordená tus listas de compras.</p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button id="share" class="btn btn-outline-secondary btn-sm" type="button">🔗 Compartir</button>
        <button id="reset" class="btn btn-outline-secondary btn-sm" type="button">🗑️ Reiniciar</button>
        <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" type="button">🌙</button>
      </div>
    </div>

    <div id="notice" class="alert alert-success py-2 d-none" role="status"></div>

    <div class="row g-3">
      <aside class="col-12 col-md-4 col-lg-3" aria-label="Listas de compras">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="h6 mb-0">Listas</h2>
          <button id="add-list" class="btn btn-outline-secondary btn-sm" type="button">+ Nueva</button>
        </div>
        <div id="lists" class="list-group" role="group" aria-label="Listas"></div>
        <p id="lists-summary" class="text-body-secondary small mt-2 mb-0"></p>
      </aside>
      <section class="col-12 col-md-8 col-lg-9">
        <div class="d-flex flex-wrap align-items-end gap-2 mb-3">
          <div class="flex-grow-1">
            <label for="list-name" class="form-label">Nombre de la lista</label>
            <input id="list-name" class="form-control" type="text" maxlength="40" autocomplete="off" style="font-size:16px">
          </div>
          <button id="delete-list" class="btn btn-outline-danger" type="button">Borrar lista</button>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <label for="raw-list" class="form-label" id="raw-label">Cargar productos</label>
            <textarea id="raw-list" class="form-control" rows="3" style="font-size:16px" placeholder="Tomates&#10;Papas&#10;Bananas"></textarea>
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-2">
              <div class="form-text mt-0">Un producto por línea.</div>
              <div class="d-flex flex-wrap gap-2">
                <button id="load-current" class="btn btn-outline-primary btn-sm" type="button">Agregar a la actual</button>
                <button id="load-new" class="btn btn-outline-primary btn-sm" type="button">Crear nueva lista</button>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
          <h2 class="h5 mb-0">Productos <span id="active-name" class="text-body-secondary fw-normal"></span></h2>
          <div class="d-flex flex-wrap gap-2">
            <button id="select-all" class="btn btn-outline-secondary btn-sm" type="button">Todos</button>
            <button id="select-none" class="btn btn-outline-secondary btn-sm" type="button">Ninguno</button>
            <button id="add-item" class="btn btn-primary btn-sm" type="button">Agregar línea</button>
          </div>
        </div>

        <div id="empty-list" class="border rounded p-4 text-body-secondary text-center">Todavía no agregaste productos.</div>
        <div id="item-list" class="vstack gap-2"></div>

        <section class="mt-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
            <h2 class="h5 mb-0">Lista para comprar</h2>
            <button id="copy-shopping-list" class="btn btn-outline-secondary btn-sm" type="button">📋 Copiar lista</button>
          </div>
          <div id="selected-list" class="border rounded p-3"></div>
        </section>
      </section>
    </div>

    <hr>
    <p class="signature">Hecho con ❤️ y ⛏️ por <a href="https://www.sipofcode.com">Lucas</a>, con ayuda de las IA.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script>
    (() => {
      const STORAGE_KEY = 'basket';
      const LEGACY_KEYS = ['basket-lista']; // MIGRACIÓN (2026-09-21): leer vieja, guardar en nueva y borrar vieja. Eliminar este bloque en 2027-03.
      function readStoredRaw() {
        const fresh = localStorage.getItem(STORAGE_KEY);
        if (fresh !== null) return fresh;
        for (const k of LEGACY_KEYS) {
          const v = localStorage.getItem(k);
          if (v !== null) {
            try { localStorage.setItem(STORAGE_KEY, v); } catch {}
            LEGACY_KEYS.forEach(x => { try { localStorage.removeItem(x); } catch {} });
            return v;
          }
        }
        return null;
      }
      function removeStored() {
        try { localStorage.removeItem(STORAGE_KEY); } catch {}
        LEGACY_KEYS.forEach(x => { try { localStorage.removeItem(x); } catch {} });
      }
      function defaultLists() {
        return [{
          id: newId(),
          name: 'Compras',
          raw: '',
          items: [
            { id: newId(), name: 'tomates', quantity: 1, unit: 'kilos', selected: true },
            { id: newId(), name: 'papas', quantity: 2, unit: 'kilos', selected: true },
            { id: newId(), name: 'bananas', quantity: 1, unit: 'docena', selected: false }
          ]
        }];
      }
      const UNITS = ['unidades', 'kilos', 'docena'];
      const MAX_LISTS = 30;
      const rawList = document.getElementById('raw-list');
      const rawLabel = document.getElementById('raw-label');
      const listsBox = document.getElementById('lists');
      const listsSummary = document.getElementById('lists-summary');
      const listNameInput = document.getElementById('list-name');
      const activeName = document.getElementById('active-name');
      const itemList = document.getElementById('item-list');
      const emptyList = document.getElementById('empty-list');
      const selectedList = document.getElementById('selected-list');
      const notice = document.getElementById('notice');
      let noticeTimeout;

      function newId() {
        return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
      }

      function normalizeItem(item) {
        if (!item || typeof item.name !== 'string') return null;
        return {
          id: typeof item.id === 'string' ? item.id : newId(),
          name: item.name.slice(0, 120),
          quantity: Math.max(0, Number(item.quantity) || 0),
          unit: UNITS.includes(item.unit) ? item.unit : 'unidades',
          selected: Boolean(item.selected)
        };
      }

      function normalizeList(value) {
        if (!value || !Array.isArray(value.items)) return null;
        const name = typeof value.name === 'string' && value.name.trim()
          ? value.name.trim().slice(0, 40)
          : 'Lista';
        return {
          id: typeof value.id === 'string' ? value.id : newId(),
          name,
          raw: typeof value.raw === 'string' ? value.raw : '',
          items: value.items.map(normalizeItem).filter(Boolean)
        };
      }

      // Acepta el formato nuevo {activeId, lists} y migra el viejo {raw, items}.
      function normalizeState(value) {
        if (!value || typeof value !== 'object') return null;
        if (Array.isArray(value.lists)) {
          const lists = value.lists.map(normalizeList).filter(Boolean).slice(0, MAX_LISTS);
          if (!lists.length) return null;
          const activeId = lists.some(list => list.id === value.activeId) ? value.activeId : lists[0].id;
          return { activeId, lists };
        }
        if (Array.isArray(value.items)) {
          const list = normalizeList({ name: 'Compras', raw: value.raw, items: value.items });
          if (!list) return null;
          return { activeId: list.id, lists: [list] };
        }
        return null;
      }

      function loadState() {
        const encoded = new URLSearchParams(window.location.search).get('data');
        if (encoded) {
          try {
            const stateFromUrl = normalizeState(JSON.parse(encoded));
            if (stateFromUrl) return { state: stateFromUrl, fromUrl: true };
          } catch { /* Se usa el estado local si la URL no es válida. */ }
        }
        try {
          const stored = normalizeState(JSON.parse(readStoredRaw()));
          if (stored) return { state: stored, fromUrl: false };
        } catch { /* Se usa el ejemplo si el estado guardado no es válido. */ }
        const lists = defaultLists();
        return { state: { activeId: lists[0].id, lists }, fromUrl: false };
      }

      const loaded = loadState();
      let state = loaded.state;

      // El estado de la URL no se guarda hasta que el usuario haga un cambio (persist).
      function persist() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
      }

      function activeList() {
        return state.lists.find(list => list.id === state.activeId) || state.lists[0];
      }

      function showNotice(message) {
        clearTimeout(noticeTimeout);
        notice.textContent = message;
        notice.classList.remove('d-none');
        noticeTimeout = setTimeout(() => notice.classList.add('d-none'), 1800);
      }

      function displayName(list) {
        const name = list.name.trim();
        return name || '(sin nombre)';
      }

      function unitLabel(unit, quantity) {
        if (unit === 'kilos') return quantity === 1 ? 'kilo' : 'kilos';
        if (unit === 'docena') return quantity === 1 ? 'docena' : 'docenas';
        return quantity === 1 ? 'unidad' : 'unidades';
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
      }

      function parseNames(text) {
        return text.split('\n').map(name => name.trim()).filter(Boolean);
      }

      function itemMarkup(item) {
        const units = UNITS.map(unit => `<option value="${unit}"${unit === item.unit ? ' selected' : ''}>${unit}</option>`).join('');
        return `<div class="card" data-id="${item.id}">
          <div class="card-body py-2">
            <div class="row g-2 align-items-center">
              <div class="col-auto"><span class="drag-handle text-body-secondary" title="Arrastrar para reordenar" aria-label="Arrastrar para reordenar">⠿</span></div>
              <div class="col-auto"><input class="form-check-input" type="checkbox" data-action="selected"${item.selected ? ' checked' : ''} aria-label="Incluir ${escapeHtml(item.name || 'producto')}"></div>
              <div class="col-auto"><div class="input-group input-group-sm"><button class="btn btn-outline-secondary" type="button" data-action="decrease" aria-label="Restar">−</button><input class="form-control text-center quantity-input" type="number" min="0" step="1" value="${item.quantity}" data-action="quantity" aria-label="Cantidad"><button class="btn btn-outline-secondary" type="button" data-action="increase" aria-label="Sumar">+</button></div></div>
              <div class="col-12 col-sm-3 col-md-2"><select class="form-select form-select-sm" data-action="unit" aria-label="Unidad">${units}</select></div>
              <div class="col"><input class="form-control form-control-sm" type="text" maxlength="120" value="${escapeHtml(item.name)}" data-action="name" placeholder="Producto" aria-label="Producto"></div>
              <div class="col-auto"><button class="btn btn-outline-danger btn-sm" type="button" data-action="delete">Borrar</button></div>
            </div>
          </div>
        </div>`;
      }

      function renderTabs(active) {
        listsBox.innerHTML = state.lists.map(list => {
          const isActive = list.id === active.id;
          return `<button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center${isActive ? ' active' : ''}" type="button" data-list="${list.id}"><span class="text-truncate">${escapeHtml(displayName(list))}</span><span class="badge text-bg-secondary rounded-pill ms-2">${list.items.length}</span></button>`;
        }).join('');
        const total = state.lists.reduce((sum, list) => sum + list.items.length, 0);
        listsSummary.textContent = `${state.lists.length} ${state.lists.length === 1 ? 'lista' : 'listas'} · ${total} ${total === 1 ? 'producto' : 'productos'} en total`;
      }

      function render() {
        const active = activeList();
        if (document.activeElement !== listNameInput) listNameInput.value = active.name;
        rawList.value = active.raw;
        const label = displayName(active);
        rawLabel.textContent = `Cargar productos en "${label}"`;
        activeName.textContent = `· ${label}`;
        renderTabs(active);
        itemList.innerHTML = active.items.map(itemMarkup).join('');
        emptyList.classList.toggle('d-none', active.items.length > 0);
        const selected = active.items.filter(item => item.selected && item.name.trim() && item.quantity > 0);
        selectedList.innerHTML = selected.length
          ? `<ul class="list-unstyled mb-0">${selected.map(item => `<li>${item.quantity} <strong>${unitLabel(item.unit, item.quantity)}</strong> de ${escapeHtml(item.name)}</li>`).join('')}</ul>`
          : '<span class="text-body-secondary">Seleccioná al menos un producto con cantidad mayor a cero.</span>';
      }

      function shoppingListText() {
        const active = activeList();
        return active.items
          .filter(item => item.selected && item.name.trim() && item.quantity > 0)
          .map(item => `${item.quantity} ${unitLabel(item.unit, item.quantity)} de ${item.name}`)
          .join('\n');
      }

      function updateItem(id, update) {
        const item = activeList().items.find(candidate => candidate.id === id);
        if (!item) return;
        update(item);
        persist();
        render();
      }

      function copyText(text) {
        if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
        const input = document.createElement('textarea');
        input.value = text;
        input.style.position = 'fixed';
        document.body.append(input);
        input.select();
        document.execCommand('copy');
        input.remove();
        return Promise.resolve();
      }

      listsBox.addEventListener('click', event => {
        const button = event.target.closest('[data-list]');
        if (!button) return;
        state.activeId = button.dataset.list;
        persist();
        render();
      });

      // Igual que en GSD/Checksmith: el nombre se edita en un campo y se guarda al escribir.
      listNameInput.addEventListener('input', () => {
        const active = activeList();
        active.name = listNameInput.value.slice(0, 40);
        persist();
        const label = displayName(active);
        rawLabel.textContent = `Cargar productos en "${label}"`;
        activeName.textContent = `· ${label}`;
        renderTabs(active);
      });

      document.getElementById('add-list').addEventListener('click', () => {
        if (state.lists.length >= MAX_LISTS) {
          showNotice(`Llegaste al máximo de ${MAX_LISTS} listas.`);
          return;
        }
        const list = { id: newId(), name: `Lista ${state.lists.length + 1}`, raw: '', items: [] };
        state.lists.push(list);
        state.activeId = list.id;
        persist();
        render();
        listNameInput.focus();
        listNameInput.select();
      });

      document.getElementById('delete-list').addEventListener('click', () => {
        if (state.lists.length <= 1) {
          showNotice('No se puede borrar la única lista.');
          return;
        }
        const active = activeList();
        if (!confirm(`¿Borrar la lista "${active.name}"?`)) return;
        state.lists = state.lists.filter(list => list.id !== active.id);
        state.activeId = state.lists[0].id;
        persist();
        render();
        showNotice('Lista borrada.');
      });

      itemList.addEventListener('click', event => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const row = button.closest('[data-id]');
        const id = row.dataset.id;
        if (button.dataset.action === 'increase') updateItem(id, item => { item.quantity += 1; item.selected = true; });
        if (button.dataset.action === 'decrease') updateItem(id, item => { item.quantity = Math.max(0, item.quantity - 1); if (!item.quantity) item.selected = false; });
        if (button.dataset.action === 'delete') {
          activeList().items = activeList().items.filter(item => item.id !== id);
          persist();
          render();
        }
      });

      itemList.addEventListener('change', event => {
        const control = event.target;
        const row = control.closest('[data-id]');
        if (!row || !control.dataset.action) return;
        const id = row.dataset.id;
        if (control.dataset.action === 'selected') updateItem(id, item => { item.selected = control.checked; });
        if (control.dataset.action === 'quantity') updateItem(id, item => { item.quantity = Math.max(0, Number(control.value) || 0); if (!item.quantity) item.selected = false; });
        if (control.dataset.action === 'unit') updateItem(id, item => { item.unit = control.value; });
        if (control.dataset.action === 'name') updateItem(id, item => { item.name = control.value; });
      });

      rawList.addEventListener('input', () => {
        activeList().raw = rawList.value;
        persist();
      });

      document.getElementById('load-current').addEventListener('click', () => {
        const names = parseNames(rawList.value);
        if (!names.length) {
          showNotice('Escribí al menos un producto.');
          return;
        }
        const active = activeList();
        names.forEach(name => active.items.push({ id: newId(), name, quantity: 1, unit: 'unidades', selected: true }));
        persist();
        render();
        showNotice(`Se agregaron ${names.length} producto(s) a "${active.name}".`);
      });

      document.getElementById('load-new').addEventListener('click', () => {
        const names = parseNames(rawList.value);
        if (!names.length) {
          showNotice('Escribí al menos un producto.');
          return;
        }
        if (state.lists.length >= MAX_LISTS) {
          showNotice(`Llegaste al máximo de ${MAX_LISTS} listas.`);
          return;
        }
        const name = names[0].slice(0, 40);
        const list = {
          id: newId(),
          name,
          raw: '',
          items: names.map(product => ({ id: newId(), name: product, quantity: 1, unit: 'unidades', selected: true }))
        };
        state.lists.push(list);
        state.activeId = list.id;
        persist();
        render();
        showNotice(`Se creó la lista "${name}".`);
      });

      document.getElementById('add-item').addEventListener('click', () => {
        activeList().items.push({ id: newId(), name: '', quantity: 1, unit: 'unidades', selected: true });
        persist();
        render();
        itemList.querySelector('[data-id]:last-child input[data-action="name"]')?.focus();
      });

      document.getElementById('select-all').addEventListener('click', () => {
        activeList().items.forEach(item => { item.selected = item.quantity > 0; });
        persist();
        render();
      });

      document.getElementById('select-none').addEventListener('click', () => {
        activeList().items.forEach(item => { item.selected = false; });
        persist();
        render();
      });

      document.getElementById('reset').addEventListener('click', () => {
        removeStored();
        const lists = defaultLists();
        state = { activeId: lists[0].id, lists };
        window.history.replaceState(null, '', window.location.pathname);
        render();
        showNotice('Se restauró la lista de ejemplo.');
      });

      document.getElementById('share').addEventListener('click', async () => {
        const url = new URL(window.location.href);
        url.search = '';
        url.searchParams.set('data', JSON.stringify(state));
        try {
          await copyText(url.toString());
          showNotice('Se copió el enlace con las listas.');
        } catch {
          showNotice('No se pudo copiar el enlace.');
        }
      });

      document.getElementById('copy-shopping-list').addEventListener('click', async () => {
        const list = shoppingListText();
        if (!list) {
          showNotice('No hay productos seleccionados para copiar.');
          return;
        }
        try {
          await copyText(list);
          showNotice('Se copió la lista de compras.');
        } catch {
          showNotice('No se pudo copiar la lista.');
        }
      });

      new Sortable(itemList, {
        animation: 150,
        handle: '.drag-handle',
        ghostClass: 'sortable-ghost',
        onEnd(event) {
          if (event.oldIndex === event.newIndex) return;
          const items = activeList().items;
          const [item] = items.splice(event.oldIndex, 1);
          items.splice(event.newIndex, 0, item);
          persist();
          render();
        }
      });

      const root = document.documentElement;
      const btn = document.getElementById('theme-toggle');
      const stored = localStorage.getItem('theme');
      const initial = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const apply = (t) => { root.setAttribute('data-bs-theme', t); btn.textContent = t === 'dark' ? '☀️' : '🌙'; };
      apply(initial);
      btn.addEventListener('click', () => {
        const next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        apply(next);
      });

      render();
    })();
  </script>
</body>
</html>
