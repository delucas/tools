<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Lucas Videla">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%26%23x23f1%3B%3C/text%3E%3C/svg%3E">
  <title>Tick — Cuenta atrás gigante</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <style>
    /* Display gigante para proyector: crece con la ventana, tabular para que no "salte". */
    #display {
      font-size: min(26vw, 38vh);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    /* Con horas el texto es más largo (H:MM:SS): achicar para que entre. */
    body.has-hours #display {
      font-size: min(16vw, 38vh);
    }

    /* Último minuto: uno o dos dígitos, entran mucho más grandes. */
    body.last-minute #display {
      font-size: min(45vw, 60vh);
    }

    /* Modo inmersivo (pantalla completa por botón ⛶ o por F11 del navegador):
       solo timer + barra de progreso, bien centrado. */
    body.immersive main {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    body.immersive #stage {
      /* Cinturón y suspensores para el centrado vertical: con margin auto
         el stage queda centrado aunque cambie el resto del layout. */
      width: 100%;
      margin-top: auto;
      margin-bottom: auto;
    }
    body.immersive main > :not(#stage) {
      /* !important: las utilidades display de Bootstrap (d-flex, d-inline-block…)
         también lo son y si no les ganan al header. */
      display: none !important;
    }
    body.immersive #display {
      font-size: min(30vw, 60vh);
    }
    body.immersive.has-hours #display {
      font-size: min(17vw, 60vh);
    }
    body.immersive.last-minute #display {
      font-size: min(60vw, 78vh);
    }
    #exit-hint {
      display: none;
    }
    body.immersive #exit-hint {
      display: block;
    }

    /* Alarma visual al llegar a cero. */
    @keyframes tick-flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    body.done #display,
    body.done #endmsg {
      animation: tick-flash 1s step-start infinite;
    }

    /* Video anti-suspensión: invisible pero reproduciendo. */
    #keepalive {
      position: fixed;
      width: 2px;
      height: 2px;
      opacity: 0.01;
      pointer-events: none;
      bottom: 0;
      right: 0;
    }

    .signature {
      font-size: 0.8em;
    }
  </style>
</head>
<body>
  <main class="container py-4">
    <a href="../" class="d-inline-block mb-2 text-body-secondary small text-decoration-none">← Todas las herramientas</a>

    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">⏱️ Tick</h1>
        <p class="text-body-secondary mb-0">Cuenta atrás gigante para proyectar, que no deja dormir la pantalla.</p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button id="lock" class="btn btn-outline-secondary btn-sm" type="button" title="Estado del bloqueo anti-suspensión. Tocá para reintentar.">…</button>
        <button id="share" class="btn btn-outline-secondary btn-sm" type="button">🔗 Compartir</button>
        <button id="reset" class="btn btn-outline-secondary btn-sm" type="button">🗑️ Reiniciar</button>
        <button id="full" class="btn btn-outline-secondary btn-sm" type="button" title="En pantalla completa se ven solo el timer y el progreso (F11 o Esc para salir)">⛶ Pantalla completa</button>
        <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" type="button">🌙</button>
      </div>
    </div>

    <div id="notice" class="alert py-2 d-none" role="status"></div>

    <section id="stage" class="text-center my-4" aria-live="off">
      <div id="display" class="font-monospace fw-bold" role="timer">5:00</div>
      <div id="endmsg" class="h2 d-none mb-3">¡Tiempo!</div>
      <div id="stopbox" class="d-none mb-3">
        <button id="stop" class="btn btn-warning" type="button">🔕 Detener alarma</button>
      </div>
      <div class="progress mt-3" role="progressbar" aria-label="Progreso">
        <div id="bar" class="progress-bar" style="width: 0%"></div>
      </div>
      <div id="exit-hint" class="text-body-secondary small mt-3">F11 o Esc para salir de la pantalla completa</div>
    </section>

    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-sm-5">
            <label for="time-input" class="form-label small mb-1">Duración</label>
            <input id="time-input" class="form-control" type="text" inputmode="numeric" autocomplete="off"
              placeholder="5:00" aria-label="Duración (minutos o min:seg)">
            <div class="form-text">Acepta <code>5</code>, <code>5:00</code> o <code>1:30:00</code>.</div>
          </div>
          <div class="col-12 col-sm-7">
            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-outline-secondary preset" type="button" data-min="5">5</button>
              <button class="btn btn-outline-secondary preset" type="button" data-min="10">10</button>
              <button class="btn btn-outline-secondary preset" type="button" data-min="15">15</button>
              <button class="btn btn-outline-secondary preset" type="button" data-min="25">25</button>
              <button class="btn btn-outline-secondary preset" type="button" data-min="45">45</button>
              <button id="start" class="btn btn-primary" type="button">▶ Iniciar</button>
              <button id="pause" class="btn btn-outline-secondary d-none" type="button">⏸ Pausar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <video id="keepalive" class="d-none" muted playsinline loop aria-hidden="true"></video>

    <hr>
    <p class="signature">Hecho con ❤️ y ⛏️ por <a href="https://www.sipofcode.com">Lucas</a>, con ayuda de las IA.</p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = 'tick';
      const DEFAULT_SECONDS = 5 * 60;
      const MAX_SECONDS = 24 * 3600;

      const display = document.getElementById('display');
      const endmsg = document.getElementById('endmsg');
      const stopbox = document.getElementById('stopbox');
      const bar = document.getElementById('bar');
      const input = document.getElementById('time-input');
      const startBtn = document.getElementById('start');
      const pauseBtn = document.getElementById('pause');
      const lockBtn = document.getElementById('lock');
      const notice = document.getElementById('notice');
      const video = document.getElementById('keepalive');
      let noticeTimeout;

      let total = DEFAULT_SECONDS;
      let remaining = DEFAULT_SECONDS;
      let endAt = 0;
      let timerId = null;
      let audioCtx = null;
      let sentinel = null;
      let wantLock = false;
      let videoFallback = false;

      /* ---------- Tiempo: parsear y formatear ---------- */

      function parseTime(raw) {
        const parts = String(raw).trim().split(':').map(p => p.trim());
        if (!parts.length || parts.some(p => !/^\d+$/.test(p))) return null;
        let seconds = 0;
        if (parts.length === 1) seconds = Number(parts[0]) * 60;
        else if (parts.length === 2) seconds = Number(parts[0]) * 60 + Number(parts[1]);
        else if (parts.length === 3) seconds = Number(parts[0]) * 3600 + Number(parts[1]) * 60 + Number(parts[2]);
        else return null;
        if (!(seconds > 0) || seconds > MAX_SECONDS) return null;
        return Math.floor(seconds);
      }

      function fmt(totalSeconds) {
        const s = Math.max(0, Math.ceil(totalSeconds));
        if (s < 60) return String(s); // Último minuto: solo segundos, sin "0:".
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const r = s % 60;
        const mm = h > 0 ? String(m).padStart(2, '0') : String(m);
        return `${h > 0 ? h + ':' : ''}${mm}:${String(r).padStart(2, '0')}`;
      }

      function fmtUrl(totalSeconds) {
        const s = Math.floor(totalSeconds);
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const r = s % 60;
        return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}` : `${m}:${String(r).padStart(2, '0')}`;
      }

      /* ---------- Estado inicial: URL > localStorage > defecto ---------- */

      function loadInitial() {
        const fromUrl = new URLSearchParams(window.location.search).get('t');
        if (fromUrl) {
          const parsed = parseTime(fromUrl);
          if (parsed) return { seconds: parsed, fromUrl: true };
        }
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (stored && typeof stored.t === 'string') {
            const parsed = parseTime(stored.t);
            if (parsed) return { seconds: parsed, fromUrl: false };
          }
        } catch { /* Se usa el valor por defecto. */ }
        return { seconds: DEFAULT_SECONDS, fromUrl: false };
      }

      const initial = loadInitial();
      const fromUrl = initial.fromUrl;
      total = initial.seconds;
      remaining = total;
      input.value = fmtUrl(total);

      function save() {
        if (fromUrl) return; // Un link compartido no pisa lo guardado.
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ t: fmtUrl(total) })); } catch {}
      }

      function showNotice(message, kind = 'success') {
        clearTimeout(noticeTimeout);
        notice.textContent = message;
        notice.className = `alert py-2 alert-${kind === 'error' ? 'danger' : 'success'}`;
        notice.classList.remove('d-none');
        noticeTimeout = setTimeout(() => notice.classList.add('d-none'), 3000);
      }

      /* ---------- Anti-suspensión: Wake Lock API + fallback por video ---------- */

      function renderLock() {
        if (videoFallback) {
          lockBtn.textContent = '📺 Pantalla despierta (video)';
          lockBtn.classList.remove('btn-outline-secondary', 'btn-outline-danger');
          lockBtn.classList.add('btn-outline-success');
        } else if (sentinel) {
          lockBtn.textContent = '🔒 Pantalla despierta';
          lockBtn.classList.remove('btn-outline-secondary', 'btn-outline-danger');
          lockBtn.classList.add('btn-outline-success');
        } else if (!('wakeLock' in navigator)) {
          lockBtn.textContent = '⚠️ Sin bloqueo (navegador viejo)';
          lockBtn.classList.remove('btn-outline-secondary', 'btn-outline-success');
          lockBtn.classList.add('btn-outline-danger');
        } else {
          lockBtn.textContent = wantLock ? '⚠️ Bloqueo perdido, reintentando…' : '🔓 Bloqueo apagado';
          lockBtn.classList.remove('btn-outline-success', 'btn-outline-danger');
          lockBtn.classList.add('btn-outline-secondary');
        }
      }

      async function startVideoFallback() {
        try {
          if (!video.srcObject) {
            const canvas = document.createElement('canvas');
            canvas.width = 2;
            canvas.height = 2;
            const stream = canvas.captureStream(1);
            video.srcObject = stream;
          }
          video.classList.remove('d-none');
          await video.play();
          videoFallback = true;
        } catch {
          videoFallback = false;
        }
        renderLock();
      }

      function stopVideoFallback() {
        try { video.pause(); } catch {}
        video.classList.add('d-none');
        videoFallback = false;
        renderLock();
      }

      async function acquireLock() {
        if (!('wakeLock' in navigator)) {
          await startVideoFallback();
          return;
        }
        try {
          sentinel = await navigator.wakeLock.request('screen');
          sentinel.addEventListener('release', () => {
            sentinel = null;
            renderLock();
          });
        } catch {
          sentinel = null;
        }
        renderLock();
      }

      function releaseLock() {
        wantLock = false;
        if (sentinel) {
          try { sentinel.release(); } catch {}
          sentinel = null;
        }
        stopVideoFallback();
        renderLock();
      }

      // El bloqueo se libera solo al ocultar la pestaña: re-pedirlo al volver.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && wantLock && !sentinel && !videoFallback) acquireLock();
      });

      lockBtn.addEventListener('click', () => {
        if (sentinel || videoFallback) {
          releaseLock();
          showNotice('Bloqueo anti-suspensión apagado.');
        } else {
          wantLock = true;
          acquireLock();
        }
      });

      /* ---------- Motor del temporizador ---------- */

      function running() {
        return timerId !== null;
      }

      function paint() {
        display.textContent = fmt(remaining);
        document.title = `${fmt(remaining)} ⏱️ Tick`;
        bar.style.width = `${total > 0 ? (100 * (total - remaining)) / total : 0}%`;
        document.body.classList.toggle('has-hours', remaining >= 3600);
        document.body.classList.toggle('last-minute', Math.ceil(remaining) < 60);
        fitDisplay();
      }

      // Auto-ajuste: el ancho real depende de la fuente de cada máquina, así que
      // se mide el texto y se achica si desborda (con 4% de margen). Garantiza que
      // cualquier duración entre, en cualquier pantalla.
      function fitDisplay() {
        display.style.fontSize = '';
        const avail = display.clientWidth;
        const need = display.scrollWidth;
        if (avail > 0 && need > avail) {
          const base = parseFloat(getComputedStyle(display).fontSize) || 0;
          if (base > 0) display.style.fontSize = `${Math.floor((base * avail) / need * 0.96)}px`;
        }
      }

      function setControls() {
        const active = running() || document.body.classList.contains('done');
        startBtn.classList.toggle('d-none', running());
        pauseBtn.classList.toggle('d-none', !running());
        pauseBtn.textContent = running() ? '⏸ Pausar' : '▶ Reanudar';
        input.disabled = active;
        document.querySelectorAll('.preset').forEach(btn => { btn.disabled = active; });
      }

      function tick() {
        remaining = Math.max(0, (endAt - Date.now()) / 1000);
        paint();
        if (remaining <= 0) finish();
      }

      function start() {
        if (running()) return;
        if (remaining <= 0) remaining = total;
        endAt = Date.now() + remaining * 1000;
        timerId = setInterval(tick, 250);
        document.body.classList.remove('done');
        endmsg.classList.add('d-none');
        stopbox.classList.add('d-none');
        wantLock = true;
        acquireLock();
        setControls();
        paint();
      }

      function pauseToggle() {
        if (running()) {
          clearInterval(timerId);
          timerId = null;
          remaining = Math.max(0, (endAt - Date.now()) / 1000);
        } else if (!document.body.classList.contains('done')) {
          endAt = Date.now() + remaining * 1000;
          timerId = setInterval(tick, 250);
        }
        setControls();
        paint();
      }

      function beep() {
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const t0 = audioCtx.currentTime;
          [0, 0.5, 1.0].forEach(offset => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.001, t0 + offset);
            gain.gain.exponentialRampToValueAtTime(0.5, t0 + offset + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + offset + 0.4);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t0 + offset);
            osc.stop(t0 + offset + 0.45);
          });
        } catch { /* Sin audio, queda el destello visual. */ }
      }

      function finish() {
        clearInterval(timerId);
        timerId = null;
        remaining = 0;
        document.body.classList.add('done');
        endmsg.classList.remove('d-none');
        stopbox.classList.remove('d-none');
        paint();
        beep(); // Una sola vez: la pantalla sigue flasheando hasta detenerla.
        setControls();
      }

      function stopAlarm() {
        document.body.classList.remove('done');
        endmsg.classList.add('d-none');
        stopbox.classList.add('d-none');
        try { audioCtx && audioCtx.suspend(); } catch {}
        setControls();
        paint();
      }

      function resetAll() {
        clearInterval(timerId);
        timerId = null;
        stopAlarm();
        releaseLock();
        total = parseTime(input.value) || total;
        remaining = total;
        document.title = 'Tick — Cuenta atrás gigante';
        bar.style.width = '0%';
        window.history.replaceState(null, '', window.location.pathname);
        setControls();
        paint();
      }

      /* ---------- Controles ---------- */

      startBtn.addEventListener('click', () => {
        if (running()) return;
        const parsed = parseTime(input.value);
        if (!parsed) {
          showNotice('Esa duración no parece válida. Probá con 5:00.', 'error');
          return;
        }
        total = parsed;
        remaining = total;
        save();
        start();
      });

      pauseBtn.addEventListener('click', pauseToggle);

      document.querySelectorAll('.preset').forEach(btn => {
        btn.addEventListener('click', () => {
          if (running() || document.body.classList.contains('done')) return;
          total = Number(btn.dataset.min) * 60;
          remaining = total;
          input.value = fmtUrl(total);
          save();
          paint();
        });
      });

      document.getElementById('stop').addEventListener('click', stopAlarm);

      document.getElementById('reset').addEventListener('click', () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch {}
        input.value = fmtUrl(DEFAULT_SECONDS);
        resetAll();
        showNotice('Temporizador reiniciado.');
      });

      document.getElementById('share').addEventListener('click', async () => {
        const url = new URL(window.location.href);
        url.search = '';
        url.searchParams.set('t', fmtUrl(total));
        try {
          if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(url.toString());
          else throw new Error('Sin portapapeles');
          showNotice('Se copió el enlace con esta duración.');
        } catch {
          showNotice('No se pudo copiar el enlace.', 'error');
        }
      });

      document.getElementById('full').addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch {
          showNotice('No se pudo cambiar a pantalla completa.', 'error');
        }
      });

      /* ---------- Modo inmersivo: solo timer + progreso ---------- */
      // Vale tanto para fullscreen por API (botón ⛶) como para F11 del navegador
      // (que además esconde la barra del navegador). El F11 se detecta por tamaño:
      // en pantalla completa del navegador la ventana mide lo mismo que la pantalla.
      function updateImmersive() {
        const api = Boolean(document.fullscreenElement);
        const f11 = Math.abs(window.innerHeight - window.screen.height) <= 2;
        document.body.classList.toggle('immersive', api || f11);
      }

      window.addEventListener('resize', updateImmersive);
      document.addEventListener('fullscreenchange', updateImmersive);

      const root = document.documentElement;
      const btn = document.getElementById('theme-toggle');
      const stored = localStorage.getItem('theme');
      const initialTheme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const apply = (t) => { root.setAttribute('data-bs-theme', t); btn.textContent = t === 'dark' ? '☀️' : '🌙'; };
      apply(initialTheme);
      btn.addEventListener('click', () => {
        const next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        apply(next);
      });

      renderLock();
      setControls();
      paint();
      updateImmersive();
      document.title = 'Tick — Cuenta atrás gigante';
      if (!('wakeLock' in navigator)) {
        showNotice('Este navegador no soporta Wake Lock: al iniciar se usará video oculto como anti-suspensión.');
      }
    })();
  </script>
</body>
</html>
