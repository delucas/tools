<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Lucas Videla">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%26%23x1f9f1%3B%3C/text%3E%3C/svg%3E">
  <title>Estructuras</title>

  <script>
    // Tema antes del CSS para evitar parpadeo (clave global `theme`).
    (function () {
      const stored = localStorage.getItem('theme');
      const theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <style>
    .canvas-wrap { position: relative; overflow: hidden; height: min(62vh, 600px); min-height: 420px; }
    svg.stage { display: block; width: 100%; height: 100%; cursor: grab; user-select: none; touch-action: none; }
    .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--bs-border-color); padding: 0; line-height: 1; font-size: .75rem; }
    .line-btn { padding: 0 .25rem; height: 26px; }
    .swatch.active, .line-btn.active { box-shadow: 0 0 0 2px var(--bs-body-bg), 0 0 0 5px var(--bs-emphasis-color); }
    .empty-state-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }

    p.signature { font-size: 0.8em; }

    .alert-flotante { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 1050; max-width: min(92vw, 560px); margin-bottom: 0; box-shadow: var(--bs-box-shadow); }

    @media (max-width: 576px) {
      .canvas-wrap { height: 420px; }
      #est-texto, #est-nombre, .est-opt input, .est-opt select { font-size: 16px; }
    }
  </style>
</head>
<body>

  <main class="container py-4">
    <div id="app">
      <a href="../" class="d-inline-block mb-2 text-body-secondary small text-decoration-none">← Todas las herramientas</a>
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
        <div>
          <h1 class="h3 mb-1">🧱 Estructuras</h1>
          <p class="text-body-secondary mb-0">Dibujá matrices, pilas y colas para tus clases.</p>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <button class="btn btn-outline-secondary btn-sm" type="button" @click="share">{{ shareCopied ? '¡Copiado!' : '🔗 Compartir' }}</button>
          <button class="btn btn-sm" type="button" @click="resetTool" :class="resetArmed ? 'btn-danger' : 'btn-outline-secondary'">{{ resetArmed ? '¿Seguro? Tocá de nuevo' : '🗑️ Reiniciar' }}</button>
          <button class="btn btn-outline-secondary btn-sm" type="button" @click="toggleTheme" :title="isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">{{ isDark ? '☀️' : '🌙' }}</button>
        </div>
      </div>
      <hr>

      <div v-if="notice" class="alert alert-success py-2 alert-flotante" role="status">{{ notice }}</div>

      <ul class="nav nav-tabs flex-wrap mb-3">
        <li class="nav-item" v-for="s in SPECS" :key="s.slug">
          <button class="nav-link" :class="{ active: tab === s.slug }" type="button" @click="switchTab(s.slug)">{{ s.nombre }}</button>
        </li>
      </ul>

      <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
        <div class="btn-group btn-group-sm" v-if="modelo.shapes.length">
          <button class="btn btn-outline-secondary" type="button" @click="downloadSVG" title="Descargar SVG">⬇️ SVG</button>
          <button class="btn btn-outline-secondary" type="button" @click="copySVG" :title="copied === 'svg' ? '¡Copiado!' : 'Copiar el SVG al portapapeles'">{{ copied === 'svg' ? '✅' : '📋' }} SVG</button>
          <button class="btn btn-outline-secondary" type="button" @click="downloadPNG" title="Descargar PNG (fondo transparente)">⬇️ PNG</button>
          <button class="btn btn-outline-secondary" type="button" @click="copyPNG" :title="copied === 'png' ? '¡Copiado!' : 'Copiar el PNG al portapapeles (fondo transparente)'">{{ copied === 'png' ? '✅' : '📋' }} PNG</button>
          <button class="btn btn-outline-secondary" type="button" @click="copyExcalidraw" :title="copied === 'excal' ? '¡Copiado! Pegalo en excalidraw.com' : 'Copiar para pegar directo en Excalidraw'">{{ copied === 'excal' ? '✅' : '📋' }} Excalidraw</button>
        </div>
        <button class="btn btn-outline-secondary btn-sm" type="button" @click="fit(true)" title="Ajustar vista" v-if="modelo.shapes.length">🎯</button>
      </div>

      <div class="row g-2">
        <div class="col-12 col-lg-8">
          <div class="canvas-wrap border rounded" ref="containerEl">
            <svg class="stage" @mousedown="onBgDown" @mousemove="onSvgMove" @mouseup="onSvgUp" @mouseleave="onSvgUp" @wheel.prevent="onWheel">
              <g :transform="`translate(${camera.offsetX},${camera.offsetY}) scale(${camera.scale})`">
                <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
                  <g v-for="s in modelo.shapes" :key="s.id" @mousedown="onShapeDown($event, s)" :style="pintando && s.rol ? 'cursor: pointer;' : ''">
                    <rect v-if="s.kind === 'rect'" :x="s.x" :y="s.y" :width="s.w" :height="s.h" :fill="s.fill" :stroke="s.stroke" :stroke-width="s.sw" />
                    <circle v-else-if="s.kind === 'circle'" :cx="s.cx" :cy="s.cy" :r="s.r" :fill="s.fill" :stroke="s.stroke" :stroke-width="s.sw" />
                    <line v-else-if="s.kind === 'line'" :x1="s.x1" :y1="s.y1" :x2="s.x2" :y2="s.y2" :stroke="s.stroke" :stroke-width="s.sw" stroke-linecap="round" :stroke-dasharray="s.dasharray || null" />
                    <g v-else-if="s.kind === 'arrow'">
                      <line :x1="s.x1" :y1="s.y1" :x2="s.x2" :y2="s.y2" :stroke="s.stroke" :stroke-width="s.sw" stroke-linecap="round" :stroke-dasharray="s.dasharray || null" />
                      <polygon :points="s.head" :fill="s.stroke" />
                    </g>
                    <text v-else-if="s.kind === 'text'" :x="s.x" :y="s.y" :font-size="s.size" :fill="s.fill" :font-style="s.italic ? 'italic' : null" :dominant-baseline="s.base || null" pointer-events="none">{{ s.label }}</text>
                  </g>
                </g>
              </g>
            </svg>

            <div class="empty-state-overlay" v-if="!modelo.shapes.length">
              <div class="card shadow-sm" style="max-width: 380px;">
                <div class="card-body text-center">
                  <div class="fs-1">🧱</div>
                  <p class="mt-2 mb-0 text-body-secondary">Cargá valores con ▶ Aplicar para dibujar.</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="card mb-2">
            <div class="card-body p-2 d-flex flex-wrap gap-1 align-items-center">
              <span class="small text-body-secondary me-1">🎨 Tocá una forma para pintarla:</span>
              <button v-for="c in NODE_COLORS" :key="c.hex" class="swatch" :class="{ active: paintColor === c.hex }"
                :style="{ background: c.hex }" :title="`Pintar de ${c.name}`" @click="togglePaint(c.hex)"></button>
              <button class="swatch bg-body" :class="{ active: paintColor === '' }" title="Quitar color" @click="togglePaint('')">✖</button>
              <div class="vr mx-1"></div>
              <button v-for="(name, st) in LINE_STYLES" :key="st" class="btn btn-sm btn-outline-secondary line-btn" :class="{ active: paintStyle === st }"
                :title="`Línea ${name}`" @click="toggleLineStyle(st)">
                <svg width="28" height="10"><line x1="3" y1="5" x2="25" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round" :stroke-dasharray="DASHES[st]" /></svg>
              </button>
            </div>
          </div>

          <div class="card">
            <div class="card-body p-2">
              <p class="small text-body-secondary mb-2">{{ spec.hint }}</p>
              <div class="est-opt d-flex flex-wrap gap-2 mb-2">
                <div v-for="o in spec.opciones" :key="o.key" :class="o.tipo === 'texto' ? 'flex-grow-1' : ''">
                  <label class="form-label small text-body-secondary mb-0" :for="'est-' + o.key">{{ o.etiqueta }}</label>
                  <input v-if="o.tipo === 'texto'" :id="'est-' + o.key" class="form-control form-control-sm font-monospace" v-model="est().opts[o.key]" @change="persist" :placeholder="o.ejemplo || ''">
                  <select v-else-if="o.tipo === 'select'" :id="'est-' + o.key" class="form-select form-select-sm" v-model.number="est().opts[o.key]" @change="persist">
                    <option v-for="v in o.valores" :key="v" :value="v">{{ v }}</option>
                  </select>
                  <div v-else-if="o.tipo === 'check'" class="form-check form-switch">
                    <input :id="'est-' + o.key" class="form-check-input" type="checkbox" role="switch" v-model="est().opts[o.key]" @change="persist">
                  </div>
                </div>
              </div>
              <label class="form-label small text-body-secondary mb-1" for="est-texto">Valores.</label>
              <textarea id="est-texto" class="form-control form-control-sm font-monospace mb-2" rows="4" v-model="draft"></textarea>
              <button class="btn btn-dark btn-sm w-100" type="button" @click="applyText">▶ Aplicar</button>
            </div>
          </div>
        </div>
      </div>

      <hr>
      <p class="signature text-body-secondary">Hecho con ❤️ y ⛏️ por <a href="https://www.sipofcode.com">Lucas</a>, con ayuda de las IA.</p>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.42/vue.global.prod.min.js"
    integrity="sha512-PREsKi18CyKMgwXMJWtvkzinqjiN0znVfDovmVadp7pKiUpyNGtq7bD2fKElDBmdfH4DGJz8pmAdgihN8NZ8TQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script>
  const { createApp, ref, reactive, computed, nextTick, onMounted, onBeforeUnmount } = Vue;

  const STORAGE_KEY = 'estructuras';
  const CELL = 56;
  const INK = '#1e1e1e', PAPER = '#ffffff', MUTED = '#6c757d';

  // Paleta funcional (misma que diagramas, para material consistente).
  const NODE_COLORS = [
    { name: 'celeste', hex: '#8be9fd' }, { name: 'verde', hex: '#50fa7b' }, { name: 'naranja', hex: '#ffb86c' },
    { name: 'rosa', hex: '#ff79c6' }, { name: 'violeta', hex: '#bd93f9' }, { name: 'rojo', hex: '#ff5555' },
    { name: 'amarillo', hex: '#f1fa8c' }, { name: 'gris', hex: '#6272a4' },
  ];
  const LINE_STYLES = { solid: 'normal', dotted: 'punteada', dashed: 'de guiones' };
  const DASHES = { solid: null, dotted: '1 4', dashed: '8 5' };

  function escXml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function textColorOn(hex) {
    const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map(c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.179 ? '#282a36' : '#f8f8f2';
  }
  // Punta de flecha en (x2, y2) apuntando según el ángulo de llegada.
  function arrowHead(x2, y2, ang, size = 10) {
    const b1 = ang + Math.PI - 0.42, b2 = ang + Math.PI + 0.42;
    return `${x2},${y2} ${x2 + Math.cos(b1) * size},${y2 + Math.sin(b1) * size} ${x2 + Math.cos(b2) * size},${y2 + Math.sin(b2) * size}`;
  }

  // ── Specs: cada estructura declara hint, ejemplo, opciones y dibujar() ──
  // dibujar(estado) -> { shapes, W, H }: formas en coordenadas locales (0,0).
  // roles de pintura: 'celda' (relleno), 'linea' (trazo).
  const SPECS = [
    {
      slug: 'matriz', nombre: 'Matriz',
      hint: 'Una fila por línea, columnas separadas por coma. Las filas cortas se rellenan.',
      ejemplo: '1, 2, 3\n4, 5, 6\n7, 8, 9',
      opciones: [
        { key: 'nombre', etiqueta: 'Nombre', tipo: 'texto', defecto: '', ejemplo: 'A' },
        { key: 'base', etiqueta: 'Base', tipo: 'select', valores: [0, 1], defecto: 0 },
        { key: 'indices', etiqueta: 'Mostrar índices', tipo: 'check', defecto: true },
      ],
      dibujar(st) {
        const MAX_R = 20, MAX_C = 12;
        let rows = st.text.split('\n').map(r => r.trim()).filter(r => r !== '').map(r => r.split(',').map(c => c.trim()));
        let recortado = false;
        if (rows.length > MAX_R) { rows = rows.slice(0, MAX_R); recortado = true; }
        if (rows.some(r => r.length > MAX_C)) recortado = true;
        rows = rows.map(r => r.slice(0, MAX_C));
        const ncols = Math.max(0, ...rows.map(r => r.length));
        const name = (st.opts.nombre || '').trim();
        const nameH = name ? 30 : 0;
        const base = st.opts.base === 1 ? 1 : 0;
        const conIdx = st.opts.indices && rows.length > 0;
        const gap = conIdx ? 24 : 8; // banda para el subíndice, sin invadir la fila de abajo
        const FS = 17;
        const shapes = [];
        rows.forEach((row, i) => {
          for (let j = 0; j < ncols; j++) {
            const v = row[j] ?? '';
            const x = j * CELL, y = nameH + i * (CELL + gap);
            const id = `m-${i}-${j}`;
            const fill = st.colors[id] || PAPER;
            shapes.push({ id, kind: 'rect', rol: 'celda', x, y, w: CELL, h: CELL, fill, stroke: INK, sw: 1.5 });
            shapes.push({ id: `mt-${i}-${j}`, kind: 'text', rol: null, x: x + CELL / 2, y: y + CELL / 2, size: FS, fill: fill !== PAPER ? textColorOn(fill) : INK, anchor: 'middle', base: 'central', label: v });
            if (conIdx) {
              const idx = `(${base + i},${base + j})`;
              shapes.push({ id: `mi-${i}-${j}`, kind: 'text', rol: null, x: x + CELL / 2, y: y + CELL + 13, size: 11, fill: MUTED, anchor: 'middle', base: null, label: idx });
            }
          }
        });
        if (name) {
          shapes.push({ id: 'm-name', kind: 'text', rol: null, x: (ncols * CELL) / 2, y: 18, size: 16, fill: INK, anchor: 'middle', base: null, label: name });
        }
        if (recortado) shapes.recortado = true;
        return { shapes, W: ncols * CELL, H: nameH + rows.length * (CELL + gap) + 8, recortado };
      },
    },
    {
      slug: 'pilacola', nombre: 'Pila / Cola',
      hint: 'Valores separados por coma o por línea. En pila el primero es el tope; en cola van de frente a fin.',
      ejemplo: '4, 7, 2, 9, 1',
      opciones: [
        { key: 'nombre', etiqueta: 'Nombre', tipo: 'texto', defecto: '' },
        { key: 'modo', etiqueta: 'Orientación', tipo: 'select', valores: ['pila', 'cola'], defecto: 'pila' },
      ],
      dibujar(st) {
        const MAX_N = 16;
        let vals = st.text.split(/[\n,]/).map(t => t.trim()).filter(v => v !== '');
        let recortado = false;
        if (vals.length > MAX_N) { vals = vals.slice(0, MAX_N); recortado = true; }
        const name = (st.opts.nombre || '').trim();
        const nameH = name ? 30 : 0;
        const FS = 17;
        const shapes = [];
        const vertical = (st.opts.modo || 'pila') === 'pila';
        const CW = vertical ? CELL * 2 : CELL, CH = vertical ? 44 : CELL;
        vals.forEach((v, i) => {
          const x = vertical ? 60 : i * CELL, y = nameH + (vertical ? i * CH : 0);
          const id = `p-${i}`;
          const fill = st.colors[id] || PAPER;
          shapes.push({ id, kind: 'rect', rol: 'celda', x, y, w: CW, h: CH, fill, stroke: INK, sw: 1.5 });
          shapes.push({ id: `pt-${i}`, kind: 'text', rol: null, x: x + CW / 2, y: y + CH / 2, size: FS, fill: fill !== PAPER ? textColorOn(fill) : INK, anchor: 'middle', base: 'central', label: v });
        });
        const flecha = (x1, y1, x2, y2, id, etiqueta, lx, ly) => {
          const ang = Math.atan2(y2 - y1, x2 - x1);
          shapes.push({ id, kind: 'arrow', rol: 'linea', x1, y1, x2, y2, head: arrowHead(x2, y2, ang), stroke: INK, sw: 2 });
          shapes.push({ id: id + '-t', kind: 'text', rol: null, x: lx, y: ly, size: 14, fill: INK, anchor: 'middle', base: 'central', label: etiqueta, italic: true });
        };
        if (vals.length) {
          if (vertical) {
            const cy = nameH + CH / 2;
            flecha(28, cy, 56, cy, 'p-tope', 'tope', 30, cy + 18);
          } else {
            const mk = (i, etiqueta) => {
              const cx = i * CELL + CELL / 2, top = nameH + CELL + 6;
              flecha(cx, top + 28, cx, top + 4, `p-${etiqueta}`, etiqueta, cx, top + 28 + 16);
            };
            mk(0, 'frente');
            if (vals.length > 1) mk(vals.length - 1, 'fin');
          }
        }
        if (name) {
          shapes.push({ id: 'p-name', kind: 'text', rol: null, x: (vertical ? 60 + CW / 2 : vals.length * CELL / 2), y: 18, size: 16, fill: INK, anchor: 'middle', base: null, label: name });
        }
        const W = vertical ? 60 + CW + 8 : Math.max(vals.length * CELL, 1);
        const H = nameH + (vertical ? vals.length * CH : CELL + (vals.length ? 62 : 8));
        if (recortado) shapes.recortado = true;
        return { shapes, W, H, recortado };
      },
    },
  ];
  const SPEC = (slug) => SPECS.find(s => s.slug === slug) || SPECS[0];

  function freshState(slug) {
    const spec = SPEC(slug);
    const opts = {};
    for (const o of spec.opciones) opts[o.key] = o.defecto;
    return { text: spec.ejemplo, colors: {}, dashes: {}, opts };
  }

  // ── Emisor SVG genérico desde shapes[] ──
  const r2 = (v) => String(Math.round(v * 100) / 100);
  function shapesToSVG(shapes, W, H) {
    const body = shapes.map(s => {
      if (s.kind === 'rect') return `<rect x="${r2(s.x)}" y="${r2(s.y)}" width="${r2(s.w)}" height="${r2(s.h)}" fill="${s.fill}" stroke="${s.stroke}" stroke-width="${s.sw}"/>`;
      if (s.kind === 'circle') return `<circle cx="${r2(s.cx)}" cy="${r2(s.cy)}" r="${r2(s.r)}" fill="${s.fill}" stroke="${s.stroke}" stroke-width="${s.sw}"/>`;
      if (s.kind === 'line') return `<line x1="${r2(s.x1)}" y1="${r2(s.y1)}" x2="${r2(s.x2)}" y2="${r2(s.y2)}" stroke="${s.stroke}" stroke-width="${s.sw}" stroke-linecap="round"${s.dasharray ? ` stroke-dasharray="${s.dasharray}"` : ''}/>`;
      if (s.kind === 'arrow') return `<line x1="${r2(s.x1)}" y1="${r2(s.y1)}" x2="${r2(s.x2)}" y2="${r2(s.y2)}" stroke="${s.stroke}" stroke-width="${s.sw}" stroke-linecap="round"${s.dasharray ? ` stroke-dasharray="${s.dasharray}"` : ''}/><polygon points="${s.head}" fill="${s.stroke}"/>`;
      return `<text x="${r2(s.x)}" y="${r2(s.y)}" font-size="${s.size}" fill="${s.fill}" text-anchor="${s.anchor || 'middle'}"${s.base ? ` dominant-baseline="${s.base}"` : ''}${s.italic ? ' font-style="italic"' : ''}>${escXml(s.label)}</text>`;
    }).join('');
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${r2(W)}" height="${r2(H)}" viewBox="0 0 ${r2(W)} ${r2(H)}" font-family="Consolas, 'Courier New', monospace">${body}</svg>`;
  }

  // IDs y semillas para el formato del portapapeles de Excalidraw.
  function exId() { return Math.random().toString(36).slice(2, 11); }
  function exSeed() { return Math.floor(Math.random() * 2 ** 31); }
  // Baseline exacto de Excalidraw (getVerticalOffset) para Cascadia Code
  // (fontFamily 3: unitsPerEm 2048, ascender 1900, descender -480).
  // Al pegar recalcula x/y/ancho/alto pero NUNCA el baseline.
  const EX_FONT_METRICS = { 3: [2048, 1900, -480] };
  function exBaseline(fontSize, lineHeight = 1.25) {
    const [upm, asc, desc] = EX_FONT_METRICS[3];
    const em = fontSize / upm;
    const linePx = fontSize * lineHeight;
    return Math.round((em * asc + (linePx - em * asc + em * desc) / 2) * 100) / 100;
  }

  // ── Emisor Excalidraw genérico desde shapes[] ──
  // Cuadrados nítidos (roundness null), textos atados a su celda cuando caen
  // adentro, y todo el dibujo en un solo grupo.
  function buildExcalidraw(shapes) {
    const now = Date.now();
    const elements = [];
    const gidAll = exId();
    const eb = () => ({
      angle: 0, strokeWidth: 1.5, strokeStyle: 'solid', roughness: 1, opacity: 100,
      groupIds: [gidAll], frameId: null, seed: exSeed(), version: 1, versionNonce: exSeed(),
      isDeleted: false, locked: false, link: null, updated: now,
    });
    const exT = (o) => elements.push({
      ...eb(), type: 'text', backgroundColor: 'transparent', fillStyle: 'solid', roundness: null,
      textAlign: 'center', fontFamily: 3, autoResize: true, lineHeight: 1.25, boundElements: null,
      index: 'a' + elements.length, ...o,
    });
    const rects = [];
    for (const s of shapes) {
      if (s.kind === 'rect' || s.kind === 'circle') {
        const id = exId();
        const isCircle = s.kind === 'circle';
        const el = {
          ...eb(), id, type: s.kind === 'circle' ? 'ellipse' : 'rectangle',
          x: isCircle ? s.cx - s.r : s.x, y: isCircle ? s.cy - s.r : s.y,
          width: isCircle ? s.r * 2 : s.w, height: isCircle ? s.r * 2 : s.h,
          strokeColor: s.stroke, backgroundColor: s.fill && s.fill !== 'transparent' ? s.fill : 'transparent',
          fillStyle: 'solid', roundness: isCircle ? { type: 2 } : null,
          index: 'a' + elements.length, boundElements: [],
        };
        elements.push(el);
        rects.push(el);
      } else if (s.kind === 'line' || s.kind === 'arrow') {
        const isArrow = s.kind === 'arrow';
        elements.push({
          ...eb(), id: exId(), type: isArrow ? 'arrow' : 'line',
          x: s.x1, y: s.y1, width: Math.abs(s.x2 - s.x1), height: Math.abs(s.y2 - s.y1),
          strokeColor: s.stroke, backgroundColor: 'transparent', fillStyle: 'solid',
          strokeStyle: 'solid', roundness: { type: 2 }, index: 'a' + elements.length,
          points: [[0, 0], [s.x2 - s.x1, s.y2 - s.y1]], startBinding: null, endBinding: null,
          startArrowhead: null, endArrowhead: isArrow ? 'arrow' : null, elbowed: false,
        });
      } else {
        const w = Math.max(String(s.label).length * s.size * 0.6, 10), h = s.size * 1.25;
        const central = s.base === 'central';
        exT({ id: exId(), x: s.x - w / 2, y: central ? s.y - h / 2 : s.y - s.size, width: w, height: h,
          strokeColor: s.fill, fontSize: s.size, verticalAlign: central ? 'middle' : 'top',
          containerId: null, text: String(s.label), originalText: String(s.label), baseline: central ? exBaseline(s.size) : s.size });
      }
    }
    // Atar textos centrados que caen dentro de una celda/figura.
    for (const t of elements.filter(e => e.type === 'text')) {
      const cx = t.x + t.width / 2, cy = t.y + t.height / 2;
      const host = rects.find(r => cx >= r.x && cx <= r.x + r.width && cy >= r.y && cy <= r.y + r.height);
      if (host && !t.containerId) {
        t.containerId = host.id;
        t.verticalAlign = 'middle';
        host.boundElements.push({ id: t.id, type: 'text' });
      }
    }
    for (const el of elements) {
      for (const k of ['x', 'y', 'width', 'height']) el[k] = Math.round(el[k] * 100) / 100;
    }
    return elements;
  }

  function downloadBlob(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function svgToPngBlob(svg, w, h) {
    const SCALE = 2;
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(w * SCALE));
        canvas.height = Math.max(1, Math.round(h * SCALE));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(resolve, 'image/png');
      };
      img.onerror = reject;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
  }

  createApp({
    setup() {
      const PADDING = 50;
      const tab = ref('matriz');
      const estados = ref({});
      const draft = ref('');
      const paintColor = ref(null);
      const paintStyle = ref(null);
      const copied = ref('');
      const notice = ref('');
      const shareCopied = ref(false);
      const resetArmed = ref(false);
      const fromUrl = ref(false);
      const isDark = ref(document.documentElement.getAttribute('data-bs-theme') === 'dark');
      let noticeTimer, resetTimer;

      const camera = reactive({ offsetX: 0, offsetY: 0, scale: 1 });
      const containerEl = ref(null);

      const spec = computed(() => SPEC(tab.value));
      function est(slug = tab.value) {
        if (!estados.value[slug]) estados.value[slug] = freshState(slug);
        return estados.value[slug];
      }

      // Modelo de formas del tab activo, con trazos pintados aplicados.
      const modelo = computed(() => {
        const st = est();
        const out = spec.value.dibujar(st);
        for (const s of out.shapes) {
          if (s.rol === 'linea' && st.dashes[s.id]) s.dasharray = DASHES[st.dashes[s.id]] || null;
        }
        return out;
      });

      function showNotice(text, ms = 2500) {
        clearTimeout(noticeTimer);
        notice.value = text;
        noticeTimer = setTimeout(() => { notice.value = ''; }, ms);
      }
      function flashCopied(kind) {
        copied.value = kind;
        showNotice(kind === 'svg' ? 'SVG copiado' : kind === 'excal' ? 'Copiado: pegalo en excalidraw.com' : 'PNG copiado');
        setTimeout(() => { if (copied.value === kind) copied.value = ''; }, 2000);
      }

      function togglePaint(hex) { paintStyle.value = null; paintColor.value = paintColor.value === hex ? null : hex; }
      function toggleLineStyle(s) { paintColor.value = null; paintStyle.value = paintStyle.value === s ? null : s; }
      function onShapeDown(e, s) {
        if (paintColor.value !== null && (s.rol === 'celda' || s.rol === 'nodo')) {
          e.stopPropagation();
          if (paintColor.value === '') delete est().colors[s.id];
          else est().colors[s.id] = paintColor.value;
          persist();
        } else if (paintStyle.value !== null && s.rol === 'linea') {
          e.stopPropagation();
          est().dashes[s.id] = paintStyle.value;
          persist();
        }
      }

      function applyText() {
        est().text = draft.value;
        if (modelo.value.recortado) showNotice('Entrada recortada al máximo.');
        persist();
      }
      function switchTab(slug) {
        tab.value = slug;
        draft.value = est(slug).text;
        persist();
        nextTick(() => fit());
      }

      // ── Estado: una sola clave `estructuras`. Prioridad URL > localStorage > defecto ──
      function currentState() {
        return { tab: tab.value, estados: estados.value };
      }
      function applyState(data) {
        const ok = data && typeof data === 'object' && data.estados && typeof data.estados === 'object';
        estados.value = ok ? data.estados : {};
        const slugs = SPECS.map(s => s.slug);
        tab.value = (ok && slugs.includes(data.tab)) ? data.tab : 'matriz';
        draft.value = est().text;
      }
      function persist() {
        if (fromUrl.value) return;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(currentState())); } catch { /* modo privado */ }
      }
      function loadInitialState() {
        const q = new URLSearchParams(window.location.search).get('d');
        if (q) {
          try {
            applyState(JSON.parse(decodeURIComponent(q)));
            fromUrl.value = true;
            return;
          } catch { /* URL inválida: se sigue con lo guardado */ }
        }
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) applyState(JSON.parse(raw));
          else { draft.value = est().text; }
        } catch { draft.value = est().text; }
      }

      function share() {
        const url = `${location.origin}${location.pathname}?d=${encodeURIComponent(JSON.stringify(currentState()))}`;
        const done = () => {
          shareCopied.value = true;
          showNotice('Link copiado');
          setTimeout(() => { shareCopied.value = false; }, 2000);
        };
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(done).catch(() => showNotice('No se pudo copiar: copiá la URL a mano'));
        else showNotice('Este navegador no deja copiar: copiá la URL a mano');
      }

      function resetTool() {
        if (!resetArmed.value) {
          resetArmed.value = true;
          clearTimeout(resetTimer);
          resetTimer = setTimeout(() => { resetArmed.value = false; }, 5000);
          return;
        }
        clearTimeout(resetTimer);
        resetArmed.value = false;
        fromUrl.value = false;
        try { localStorage.removeItem(STORAGE_KEY); } catch { /* modo privado */ }
        history.replaceState(null, '', window.location.pathname);
        estados.value = {};
        tab.value = 'matriz';
        draft.value = est().text;
        persist();
      }

      // ── Cámara: pan / zoom / encuadre ──
      function screenToWorld(x, y) {
        return { x: (x - camera.offsetX) / camera.scale, y: (y - camera.offsetY) / camera.scale };
      }
      function mousePos(e) {
        const rect = containerEl.value.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }
      let panning = null;
      function onBgDown(e) {
        const m = mousePos(e);
        panning = { x: m.x, y: m.y, offsetX: camera.offsetX, offsetY: camera.offsetY };
      }
      function onSvgMove(e) {
        if (!panning) return;
        const m = mousePos(e);
        camera.offsetX = panning.offsetX + (m.x - panning.x);
        camera.offsetY = panning.offsetY + (m.y - panning.y);
      }
      function onSvgUp() { panning = null; }
      function onWheel(e) {
        const m = mousePos(e);
        const before = screenToWorld(m.x, m.y);
        camera.scale = Math.min(3, Math.max(0.2, camera.scale * (e.deltaY < 0 ? 1.1 : 0.9)));
        camera.offsetX = m.x - before.x * camera.scale;
        camera.offsetY = m.y - before.y * camera.scale;
      }
      function fit(manual) {
        if (!containerEl.value) return;
        const { W, H } = modelo.value;
        const w = containerEl.value.clientWidth, h = containerEl.value.clientHeight;
        camera.scale = Math.max(0.2, Math.min((w - PADDING * 2) / Math.max(W, 1), (h - PADDING * 2) / Math.max(H, 1), 1.6));
        camera.offsetX = w / 2 - (W / 2) * camera.scale;
        camera.offsetY = h / 2 - (H / 2) * camera.scale;
      }

      function copyExcalidraw() {
        const { shapes } = modelo.value;
        const payload = JSON.stringify({ type: 'excalidraw/clipboard', elements: buildExcalidraw(shapes), files: {} });
        if (!navigator.clipboard?.writeText) { showNotice('Este navegador no deja copiar: probá con Chrome'); return; }
        navigator.clipboard.writeText(payload).then(() => flashCopied('excal')).catch(() => showNotice('No se pudo copiar'));
      }

      // ── Exports SVG/PNG desde shapes[] ──
      function downloadSVG() {
        const { shapes, W, H } = modelo.value;
        downloadBlob(new Blob([shapesToSVG(shapes, W, H)], { type: 'image/svg+xml' }), 'estructura.svg');
        showNotice('SVG descargado');
      }
      function copySVG() {
        const { shapes, W, H } = modelo.value;
        if (!navigator.clipboard?.writeText) { downloadSVG(); return; }
        navigator.clipboard.writeText(shapesToSVG(shapes, W, H)).then(() => flashCopied('svg')).catch(downloadSVG);
      }
      async function downloadPNG() {
        const { shapes, W, H } = modelo.value;
        try { downloadBlob(await svgToPngBlob(shapesToSVG(shapes, W, H), W, H), 'estructura.png'); showNotice('PNG descargado'); }
        catch { showNotice('No se pudo generar el PNG'); }
      }
      function copyPNG() {
        if (!window.ClipboardItem || !navigator.clipboard?.write) { downloadPNG(); return; }
        const { shapes, W, H } = modelo.value;
        navigator.clipboard.write([new ClipboardItem({ 'image/png': svgToPngBlob(shapesToSVG(shapes, W, H), W, H) })])
          .then(() => flashCopied('png'))
          .catch(downloadPNG);
      }

      // ── Tema claro/oscuro (clave global `theme`) ──
      function toggleTheme() {
        isDark.value = !isDark.value;
        const theme = isDark.value ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', theme);
        try { localStorage.setItem('theme', theme); } catch { /* modo privado */ }
      }

      const resizeObserver = new ResizeObserver(() => fit());
      onMounted(() => {
        loadInitialState();
        fit();
        if (containerEl.value) resizeObserver.observe(containerEl.value);
      });
      onBeforeUnmount(() => resizeObserver.disconnect());

      return {
        SPECS, spec, tab, switchTab, estados, est, draft, applyText, modelo, persist,
        NODE_COLORS, LINE_STYLES, DASHES, paintColor, paintStyle, togglePaint, toggleLineStyle, onShapeDown,
        copied, downloadSVG, downloadPNG, copySVG, copyPNG, copyExcalidraw,
        notice, shareCopied, share, resetArmed, resetTool,
        camera, containerEl, onBgDown, onSvgMove, onSvgUp, onWheel, fit,
        isDark, toggleTheme,
      };
    }
  }).mount('#app');
  </script>
</body>
</html>
