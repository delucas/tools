<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Lucas Videla">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%26%23x1f9f1%3B%3C/text%3E%3C/svg%3E">
  <title>Estructuras</title>

  <script>
    // Tema antes del CSS para evitar parpadeo (clave global `theme`).
    (function () {
      const stored = localStorage.getItem('theme');
      const theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <style>
    .canvas-wrap { position: relative; overflow: hidden; height: min(62vh, 600px); min-height: 420px; }
    svg.stage { display: block; width: 100%; height: 100%; cursor: grab; user-select: none; touch-action: none; }
    .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--bs-border-color); padding: 0; line-height: 1; font-size: .75rem; }
    .line-btn { padding: 0 .25rem; height: 26px; }
    .swatch.active, .line-btn.active { box-shadow: 0 0 0 2px var(--bs-body-bg), 0 0 0 5px var(--bs-emphasis-color); }
    .empty-state-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }

    p.signature { font-size: 0.8em; }

    .alert-flotante { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 1050; max-width: min(92vw, 560px); margin-bottom: 0; box-shadow: var(--bs-box-shadow); }

    @media (max-width: 576px) {
      .canvas-wrap { height: 420px; }
      #est-texto, #est-nombre, .est-opt input, .est-opt select { font-size: 16px; }
    }
  </style>
</head>
<body>

  <main class="container py-4">
    <div id="app">
      <a href="../" class="d-inline-block mb-2 text-body-secondary small text-decoration-none">← Todas las herramientas</a>
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
        <div>
          <h1 class="h3 mb-1">🧱 Estructuras</h1>
          <p class="text-body-secondary mb-0">Dibujá arreglos, matrices, pilas, colas, listas, árboles y grafos para tus clases.</p>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <button class="btn btn-outline-secondary btn-sm" type="button" @click="share">{{ shareCopied ? '¡Copiado!' : '🔗 Compartir' }}</button>
          <button class="btn btn-sm" type="button" @click="resetTool" :class="resetArmed ? 'btn-danger' : 'btn-outline-secondary'">{{ resetArmed ? '¿Seguro? Tocá de nuevo' : '🗑️ Reiniciar' }}</button>
          <button class="btn btn-outline-secondary btn-sm" type="button" @click="toggleTheme" :title="isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">{{ isDark ? '☀️' : '🌙' }}</button>
        </div>
      </div>
      <hr>

      <div v-if="notice" class="alert alert-success py-2 alert-flotante" role="status">{{ notice }}</div>

      <ul class="nav nav-tabs flex-wrap mb-3">
        <li class="nav-item" v-for="s in SPECS" :key="s.slug">
          <button class="nav-link" :class="{ active: tab === s.slug }" type="button" @click="switchTab(s.slug)">{{ s.nombre }}</button>
        </li>
      </ul>

      <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
        <div class="btn-group btn-group-sm" v-if="modelo.shapes.length">
          <button class="btn btn-outline-secondary" type="button" @click="downloadSVG" title="Descargar SVG">⬇️ SVG</button>
          <button class="btn btn-outline-secondary" type="button" @click="copySVG" :title="copied === 'svg' ? '¡Copiado!' : 'Copiar el SVG al portapapeles'">{{ copied === 'svg' ? '✅' : '📋' }} SVG</button>
          <button class="btn btn-outline-secondary" type="button" @click="downloadPNG" title="Descargar PNG (fondo transparente)">⬇️ PNG</button>
          <button class="btn btn-outline-secondary" type="button" @click="copyPNG" :title="copied === 'png' ? '¡Copiado!' : 'Copiar el PNG al portapapeles (fondo transparente)'">{{ copied === 'png' ? '✅' : '📋' }} PNG</button>
          <button class="btn btn-outline-secondary" type="button" @click="copyExcalidraw" :title="copied === 'excal' ? '¡Copiado! Pegalo en excalidraw.com' : 'Copiar para pegar directo en Excalidraw'">{{ copied === 'excal' ? '✅' : '📋' }} Excalidraw</button>
          <button class="btn btn-outline-secondary" type="button" @click="downloadPPTX" title="Diapositiva con figuras editables (PowerPoint / Google Slides)">⬇️ PPTX</button>
        </div>
        <button class="btn btn-outline-secondary btn-sm" type="button" @click="fit(true)" title="Ajustar vista" v-if="modelo.shapes.length">🎯</button>
      </div>

      <div class="row g-2">
        <div class="col-12 col-lg-8">
          <div class="canvas-wrap border rounded" ref="containerEl">
            <svg class="stage" @mousedown="onBgDown" @mousemove="onSvgMove" @mouseup="onSvgUp" @mouseleave="onSvgUp" @wheel.prevent="onWheel">
              <g :transform="`translate(${camera.offsetX},${camera.offsetY}) scale(${camera.scale})`">
                <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
                    <g v-for="s in modelo.shapes" :key="s.id" @mousedown="onShapeDown($event, s)" :style="pintando(s) ? 'cursor: pointer;' : (s.drag ? 'cursor: grab;' : '')">
                    <rect v-if="s.kind === 'rect'" :x="s.x" :y="s.y" :width="s.w" :height="s.h" :fill="s.fill" :stroke="s.stroke" :stroke-width="s.sw" />
                    <circle v-else-if="s.kind === 'circle'" :cx="s.cx" :cy="s.cy" :r="s.r" :fill="s.fill" :stroke="s.stroke" :stroke-width="s.sw" />
                    <line v-else-if="s.kind === 'line'" :x1="s.x1" :y1="s.y1" :x2="s.x2" :y2="s.y2" :stroke="s.stroke" :stroke-width="s.sw" stroke-linecap="round" :stroke-dasharray="s.dasharray || null" />
                    <g v-else-if="s.kind === 'arrow'">
                      <line :x1="s.x1" :y1="s.y1" :x2="s.x2" :y2="s.y2" :stroke="s.stroke" :stroke-width="s.sw" stroke-linecap="round" :stroke-dasharray="s.dasharray || null" />
                      <polygon :points="s.head" :fill="s.stroke" />
                    </g>
                    <text v-else-if="s.kind === 'text'" :x="s.x" :y="s.y" :font-size="s.size" :fill="s.fill" :font-style="s.italic ? 'italic' : null" :dominant-baseline="s.base || null" pointer-events="none">{{ s.label }}</text>
                  </g>
                </g>
              </g>
            </svg>

            <div class="empty-state-overlay" v-if="!modelo.shapes.length">
              <div class="card shadow-sm" style="max-width: 380px;">
                <div class="card-body text-center">
                  <div class="fs-1">🧱</div>
                  <p class="mt-2 mb-0 text-body-secondary">Escribí valores para dibujar.</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="card mb-2">
            <div class="card-body p-2">
              <p class="small text-body-secondary mb-1">🎨 Tocá una forma para pintarla:</p>
              <div class="d-flex gap-1 align-items-center mb-1">
                <button v-for="c in NODE_COLORS" :key="c.hex" class="swatch" :class="{ active: paintColor === c.hex }"
                  :style="{ background: c.hex }" :title="`Pintar de ${c.name}`" @click="togglePaint(c.hex)"></button>
                <button class="swatch bg-body" :class="{ active: paintColor === '' }" title="Quitar color" @click="togglePaint('')">✖</button>
              </div>
              <div class="d-flex flex-wrap gap-1 align-items-center">
                <button v-for="(name, st) in LINE_STYLES" :key="st" class="btn btn-sm btn-outline-secondary line-btn" :class="{ active: paintStyle === st }"
                  :title="`Línea ${name}`" @click="toggleLineStyle(st)">
                  <svg width="28" height="10"><line x1="3" y1="5" x2="25" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round" :stroke-dasharray="DASHES[st]" /></svg>
                </button>
                <button class="btn btn-sm ms-auto" type="button" @click="clearFormats" :class="clearArmed ? 'btn-danger' : 'btn-outline-secondary'"
                  :title="clearArmed ? 'Tocá de nuevo para confirmar' : 'Quitar colores y trazos del tab actual'">{{ clearArmed ? '¿Seguro? Tocá de nuevo' : '🧹 Sin formato' }}</button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-body p-2">
              <p class="small text-body-secondary mb-2">{{ spec.hint }}</p>
              <div class="est-opt d-flex flex-wrap gap-2 mb-2">
                <div v-for="o in spec.opciones" :key="o.key" :class="o.tipo === 'texto' ? 'flex-grow-1' : ''">
                  <label class="form-label small text-body-secondary mb-0" :for="'est-' + o.key">{{ o.etiqueta }}</label>
                  <input v-if="o.tipo === 'texto'" :id="'est-' + o.key" class="form-control form-control-sm font-monospace" v-model="est().opts[o.key]" @change="persist" :placeholder="o.ejemplo || ''">
                  <select v-else-if="o.tipo === 'select'" :id="'est-' + o.key" class="form-select form-select-sm" v-model="est().opts[o.key]" @change="persist">
                    <option v-for="v in o.valores" :key="v" :value="v">{{ (o.etiquetas && o.etiquetas[v]) || v }}</option>
                  </select>
                  <div v-else-if="o.tipo === 'check'" class="form-check form-switch">
                    <input :id="'est-' + o.key" class="form-check-input" type="checkbox" role="switch" v-model="est().opts[o.key]" @change="persist">
                  </div>
                </div>
              </div>
              <label class="form-label small text-body-secondary mb-1" for="est-texto">Valores (se dibujan al escribir).</label>
              <textarea id="est-texto" class="form-control form-control-sm font-monospace mb-2" rows="4" v-model="est().text" @input="onType" @keydown="onDraftKey"></textarea>
            </div>
          </div>
        </div>
      </div>

      <hr>
      <p class="signature text-body-secondary">Hecho con ❤️ y ⛏️ por <a href="https://www.sipofcode.com">Lucas</a>, con ayuda de las IA.</p>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.42/vue.global.prod.min.js"
    integrity="sha512-PREsKi18CyKMgwXMJWtvkzinqjiN0znVfDovmVadp7pKiUpyNGtq7bD2fKElDBmdfH4DGJz8pmAdgihN8NZ8TQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script>
  const { createApp, ref, reactive, computed, nextTick, onMounted, onBeforeUnmount } = Vue;

  const STORAGE_KEY = 'estructuras';
  const CELL = 56;
  const INK = '#1e1e1e', PAPER = '#ffffff', MUTED = '#6c757d';

  // Paleta funcional para material consistente en clase.
  const NODE_COLORS = [
    { name: 'celeste', hex: '#8be9fd' }, { name: 'verde', hex: '#50fa7b' }, { name: 'naranja', hex: '#ffb86c' },
    { name: 'rosa', hex: '#ff79c6' }, { name: 'violeta', hex: '#bd93f9' }, { name: 'rojo', hex: '#ff5555' },
    { name: 'amarillo', hex: '#f1fa8c' }, { name: 'gris', hex: '#6272a4' },
  ];
  const LINE_STYLES = { solid: 'normal', dotted: 'punteada', dashed: 'de guiones' };
  const DASHES = { solid: null, dotted: '1 4', dashed: '8 5' };

  // Convención de indicadores: glifos direccionales (no líneas dibujadas).
  // Se usan para punteros e indicadores (tope/frente/fin, head/tail, subíndices).
  const FLECHAS = { arriba: '⬆', abajo: '⬇', izquierda: '⬅', derecha: '➡' };
  function escXml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function textColorOn(hex) {
    const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map(c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.179 ? '#282a36' : '#f8f8f2';
  }

  // ── Ayudas para grafos y árboles (specs grafo y arbol) ──
  const NODE_R = 22, GRAPH_R = 160;
  function edgeKeyG(a, b, dirigido) { return dirigido ? `${a}>${b}` : [a, b].sort().join('|'); }
  // Parseo del grafo: "A-B:3" declara una arista con costo "3" (texto libre,
  // opcional), "G" sola declara un nodo aislado. Sin bucles.
  function parseGraph(text, dirigido) {
    const tokens = String(text).split(/[\n,]/).map(t => t.trim()).filter(Boolean);
    const nodeLabels = [], nodeSet = new Set(), edgeSet = new Set(), edges = [];
    const addNode = (label) => { if (!nodeSet.has(label)) { nodeSet.add(label); nodeLabels.push(label); } };
    for (const tok of tokens) {
      const [edgePart, weightPart = ''] = tok.split(':').map(s => s.trim());
      const parts = edgePart.split('-').map(s => s.trim()).filter(Boolean);
      if (parts.length >= 2) {
        const [a, b] = parts;
        addNode(a); addNode(b);
        if (a === b) continue;
        const key = edgeKeyG(a, b, dirigido);
        if (!edgeSet.has(key)) { edgeSet.add(key); edges.push({ a, b, w: weightPart, key }); }
      } else if (parts.length === 1) {
        addNode(parts[0]);
      }
    }
    return { nodeLabels, edges };
  }
  // Layout circular que conserva las posiciones conocidas (las guarda el arrastre en st.pos).
  function circlePos(labels, known) {
    const pos = {};
    labels.forEach((label, i) => {
      if (known[label]) { pos[label] = known[label]; return; }
      const ang = (i / labels.length) * Math.PI * 2 - Math.PI / 2;
      pos[label] = { x: Math.cos(ang) * GRAPH_R, y: Math.sin(ang) * GRAPH_R };
    });
    return pos;
  }
  // Punta de flecha recta: tip en (x2,y2), de 11x5.
  function arrowHead(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len, bx = x2 - ux * 11, by = y2 - uy * 11;
    return `${r2(x2)},${r2(y2)} ${r2(bx - uy * 5)},${r2(by + ux * 5)} ${r2(bx + uy * 5)},${r2(by - ux * 5)}`;
  }
  // Árbol: parseo por bloques indentados (tabs o espacios).
  function parseTree(text) {
    const roots = [], stack = [];
    let id = 0;
    for (const raw of String(text).split('\n')) {
      const line = raw.replace(/\t/g, '  ');
      const m = line.match(/^(\s*)(.*)$/);
      const label = m[2].trim();
      if (!label) continue;
      const node = { id: id++, label, children: [] };
      const indent = m[1].length;
      while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
      if (stack.length) stack[stack.length - 1].node.children.push(node);
      else roots.push(node);
      stack.push({ indent, node });
    }
    return roots;
  }
  // Árbol: layout compacto por profundidad, con padres centrados sobre sus hijos.
  function layoutTree(roots) {
    const UX = NODE_R * 2 + 26, UY = NODE_R * 2 + 52;
    const pos = new Map();
    let cursor = 0, minX = 0, maxX = 0;
    function walk(node, depth) {
      if (!node.children.length) {
        pos.set(node, { x: cursor * UX, y: depth * UY });
        minX = Math.min(minX, cursor * UX); maxX = Math.max(maxX, cursor * UX);
        cursor++;
      } else {
        node.children.forEach(ch => walk(ch, depth + 1));
        const xs = node.children.map(ch => pos.get(ch).x);
        const x = (Math.min(...xs) + Math.max(...xs)) / 2;
        pos.set(node, { x, y: depth * UY });
        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      }
    }
    roots.forEach(r => { walk(r, 0); cursor += 1; });
    const shift = -(minX + maxX) / 2;
    for (const p of pos.values()) p.x += shift;
    return pos;
  }
  // Posiciones + recentrado del grafo (lo comparten dibujar() y onDrag()).
  // El recentrado se congela por versión del texto: al arrastrar un nodo, el
  // resto del dibujo no se mueve (el nodo sigue al cursor 1:1).
  function grafoModelo(st) {
    const dirigido = (st.opts.tipo || 'dirigido') === 'dirigido';
    const { nodeLabels, edges } = parseGraph(st.text, dirigido);
    if (!st.pos) st.pos = {};
    const pos = circlePos(nodeLabels, st.pos);
    // Poda de posiciones huérfanas (restos del tipeo letra por letra): solo
    // borra claves, así converge sin recálculos y no viajan en los links.
    for (const k of Object.keys(st.pos)) if (!nodeLabels.includes(k)) delete st.pos[k];
    const PAD = 28;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const l of nodeLabels) {
      const p = pos[l];
      x0 = Math.min(x0, p.x - NODE_R); y0 = Math.min(y0, p.y - NODE_R);
      x1 = Math.max(x1, p.x + NODE_R); y1 = Math.max(y1, p.y + NODE_R);
    }
    if (!st.org || st._t !== st.text) {
      st.org = nodeLabels.length ? { x: PAD - x0, y: PAD - y0 } : { x: 0, y: 0 };
      st._t = st.text;
    }
    return { dirigido, nodeLabels, edges, pos,
      ox: st.org.x, oy: st.org.y,
      W: nodeLabels.length ? (x1 - x0 + PAD * 2) : 1, H: nodeLabels.length ? (y1 - y0 + PAD * 2) : 1 };
  }
  // Punteros del arreglo: "letra:índice-visible" separados por coma (p. ej. "i:2, j:0").
  function parsePtrs(str, base, n) {
    const ptrs = [];
    for (const tok of String(str || '').split(/[\n,]/).map(t => t.trim()).filter(Boolean)) {
      const m = tok.match(/^(.+?)\s*:\s*(-?\d+)$/);
      if (!m) continue;
      const p = Number(m[2]) - base;
      if (p >= 0 && p < n) ptrs.push({ label: m[1].trim(), pos: p });
    }
    return ptrs;
  }

  // ── Specs: cada estructura declara hint, ejemplo, opciones y dibujar() ──
  // dibujar(estado) -> { shapes, W, H }: formas en coordenadas locales (0,0).
  // roles de pintura: 'celda' (relleno), 'linea' (trazo).
  const SPECS = [
    {
      slug: 'arreglo', nombre: 'Arreglo',
      hint: 'Valores separados por coma o por línea. Punteros como i:2 (letra:índice visible), separados por coma. Arrastrá ⬆ para moverlos.',
      ejemplo: '4, 7, 2, 9, 1',
      opciones: [
        { key: 'nombre', etiqueta: 'Nombre', tipo: 'texto', defecto: 'v' },
        { key: 'base', etiqueta: 'Base', tipo: 'select', valores: [0, 1], defecto: 0 },
        { key: 'punteros', etiqueta: 'Punteros', tipo: 'texto', defecto: 'i:2' },
      ],
      dibujar(st) {
        const MAX_N = 64;
        let vals = String(st.text).split(/[\n,]/).map(t => t.trim()).filter(v => v !== '');
        let recortado = false;
        if (vals.length > MAX_N) { vals = vals.slice(0, MAX_N); recortado = true; }
        const name = (st.opts.nombre || '').trim();
        const nameH = name ? 30 : 0;
        const base = Number(st.opts.base) === 1 ? 1 : 0;
        const ptrs = parsePtrs(st.opts.punteros, base, vals.length);
        const FS = 17;
        const shapes = [];
        vals.forEach((v, i) => {
          const x = i * CELL, y = nameH, id = `a-${i}`;
          const fill = st.colors[id] || PAPER;
          shapes.push({ id, kind: 'rect', rol: 'celda', x, y, w: CELL, h: CELL, fill, stroke: INK, sw: 1.5 });
          shapes.push({ id: `at-${i}`, kind: 'text', rol: null, x: x + CELL / 2, y: y + CELL / 2, size: FS, fill: fill !== PAPER ? textColorOn(fill) : INK, anchor: 'middle', base: 'central', label: v });
          shapes.push({ id: `ai-${i}`, kind: 'text', rol: null, x: x + CELL / 2, y: y + CELL + 13, size: 11, fill: MUTED, anchor: 'middle', base: null, label: String(base + i) });
        });
        // Punteros agrupados por celda; si comparten se abren en abanico.
        const byPos = new Map();
        ptrs.forEach((p, n) => { p.n = n; if (!byPos.has(p.pos)) byPos.set(p.pos, []); byPos.get(p.pos).push(p); });
        const gy = nameH + CELL + 13 + 18;
        for (const [, list] of byPos) {
          list.forEach((p, k) => {
            const cx = p.pos * CELL + CELL / 2 + (k - (list.length - 1) / 2) * 20;
            const gid = `g-p${p.n}`;
            shapes.push({ id: `ap-${p.n}`, kind: 'text', rol: null, grupo: gid, x: cx, y: gy, size: 24, fill: INK, anchor: 'middle', base: 'central', label: FLECHAS.arriba });
            shapes.push({ id: `ap-${p.n}-t`, kind: 'text', rol: null, grupo: gid, x: cx, y: gy + 26, size: 14, fill: INK, anchor: 'middle', base: 'central', label: p.label, italic: true });
            // Área de toque para arrastrar (los textos no reciben mouse).
            shapes.push({ id: `ap-${p.n}-hit`, kind: 'rect', rol: null, ghost: true, drag: `p${p.n}`, x: cx - 16, y: gy - 20, w: 32, h: 66, fill: 'transparent', stroke: 'none', sw: 0 });
          });
        }
        if (name) {
          shapes.push({ id: 'a-name', kind: 'text', rol: null, x: vals.length * CELL / 2, y: 18, size: 16, fill: INK, anchor: 'middle', base: null, label: name });
        }
        const W = Math.max(vals.length * CELL, 1);

        const { shapes, W, H } = modelo.value;
        downloadBlob(new Blob([shapesToSVG(shapes, W, H)], { type: 'image/svg+xml' }), 'estructura.svg');
        showNotice('SVG descargado');
      }
      function copySVG() {
        const { shapes, W, H } = modelo.value;
        if (!navigator.clipboard?.writeText) { downloadSVG(); return; }
        navigator.clipboard.writeText(shapesToSVG(shapes, W, H)).then(() => flashCopied('svg')).catch(downloadSVG);
      }
      async function downloadPNG() {
        const { shapes, W, H } = modelo.value;
        try { downloadBlob(await svgToPngBlob(shapesToSVG(shapes, W, H), W, H), 'estructura.png'); showNotice('PNG descargado'); }
        catch { showNotice('No se pudo generar el PNG'); }
      }
      function copyPNG() {
        if (!window.ClipboardItem || !navigator.clipboard?.write) { downloadPNG(); return; }
        const { shapes, W, H } = modelo.value;
        navigator.clipboard.write([new ClipboardItem({ 'image/png': svgToPngBlob(shapesToSVG(shapes, W, H), W, H) })])
          .then(() => flashCopied('png'))
          .catch(downloadPNG);
      }

      // ── Tema claro/oscuro (clave global `theme`) ──
      function toggleTheme() {
        isDark.value = !isDark.value;
        const theme = isDark.value ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', theme);
        try { localStorage.setItem('theme', theme); } catch { /* modo privado */ }
      }

      const resizeObserver = new ResizeObserver(() => fit());
      onMounted(() => {
        loadInitialState();
        fit();
        if (containerEl.value) resizeObserver.observe(containerEl.value);
      });
      onBeforeUnmount(() => resizeObserver.disconnect());

      return {
        SPECS, spec, tab, switchTab, estados, est, onType, onDraftKey, modelo, persist,
        NODE_COLORS, LINE_STYLES, DASHES, paintColor, paintStyle, togglePaint, toggleLineStyle, pintando, onShapeDown,
        clearArmed, clearFormats,
        copied, downloadSVG, downloadPNG, copySVG, copyPNG, copyExcalidraw, downloadPPTX,
        notice, shareCopied, share, resetArmed, resetTool,
        camera, containerEl, onBgDown, onSvgMove, onSvgUp, onWheel, fit,
        isDark, toggleTheme,
      };
    }
  }).mount('#app');
  </script>
