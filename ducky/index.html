<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Lucas Videla">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%26%23x1f986%3B%3C/text%3E%3C/svg%3E">
  <title>Ducky</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <style>
    /* Solo lo que Bootstrap no puede hacer */

    #app {
      max-width: 540px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .avatar {
      width: 44px;
      height: 44px;
      object-fit: cover;
    }

    /* Área de chat: alto fijo con scroll, como en el teléfono */
    .chat-area {
      height: 50dvh;
      overflow-y: auto;
    }

    /* Globito del autor, siempre a la derecha */
    .bubble {
      display: inline-block;
      max-width: 75%;
      border-radius: 18px 18px 4px 18px;
      padding: .5rem .85rem;
      overflow-wrap: anywhere;
      animation: pop .2s ease;
      transition: opacity .5s ease;
    }
    .chat-area.leaving .bubble {
      opacity: 0;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Entrada de texto sin resize */
    textarea.form-control { resize: none; overflow: hidden; }

    @media (max-width: 576px) {
      textarea.form-control {
        font-size: 16px;
      }
    }

    p.signature {
      font-size: 0.8em;
    }
  </style>
</head>

<body>
<div id="app" class="container py-4 d-flex flex-column gap-3">

  <a href="../" class="d-inline-block text-body-secondary small text-decoration-none">← Todas las herramientas</a>
  <div class="d-flex flex-wrap justify-content-end gap-2">
    <button class="btn btn-outline-secondary btn-sm" type="button" @click="share">{{ shared ? '¡Copiado!' : '🔗 Compartir' }}</button>
    <button class="btn btn-outline-secondary btn-sm" type="button" @click="reset">🗑️ Reiniciar</button>
    <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" type="button">🌙</button>
  </div>

  <!-- Cabecera estilo WhatsApp: avatar, nombre y estado -->
  <div class="d-flex align-items-center gap-2 border rounded p-2 bg-body-tertiary">
    <div class="position-relative flex-shrink-0">
      <span
        v-if="isTyping"
        class="position-absolute top-0 end-0 badge bg-body text-body-secondary border small"
        style="font-size:.7rem"
      >…</span>
      <img class="avatar rounded-circle" src="ducky.png" alt="Ducky, el patito de goma">
    </div>
    <div>
      <h1 class="h6 mb-0">Ducky</h1>
      <p class="text-body-secondary small fst-italic mb-0">siempre escucha, nunca juzga</p>
    </div>
  </div>

  <!-- Conversación: solo globitos del autor, a la derecha -->
  <div class="chat-area d-flex flex-column gap-2 px-1" :class="{ leaving }" ref="chatWindow">
    <p v-if="messages.length === 0" class="text-center text-body-secondary small my-auto py-5 opacity-75">
      🦆<br>El patito escucha.<br>O solo mira fijo.<br>Cuesta saberlo.
    </p>
    <div v-for="msg in messages" :key="msg.id" class="d-flex justify-content-end">
      <div class="bubble bg-primary text-white">
        {{ msg.text }}
        <div class="text-end mt-1" style="font-size:.65rem;opacity:.7">{{ msg.time }}</div>
      </div>
    </div>
  </div>

  <div class="text-center" :class="{ invisible: messages.length === 0 }">
    <button
      class="btn btn-sm btn-outline-secondary rounded-pill px-3"
      :disabled="celebrating"
      @click="resolved"
    >✦ ¡Lo resolví!</button>
  </div>

  <div class="input-group">
    <textarea
      class="form-control rounded-start-4"
      ref="inputRef"
      v-model="draft"
      placeholder="Contale todo al patito…"
      rows="1"
      @keydown.enter.exact.prevent="sendMessage"
      @input="autoResize"
    ></textarea>
    <button
      class="btn btn-primary rounded-end-4 px-3"
      :disabled="!draft.trim()"
      @click="sendMessage"
      aria-label="Enviar"
    >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2 14L14 8 2 2v4.5l8 1.5-8 1.5z" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <p class="signature text-body-secondary mt-2">Hecho con ❤️ y ⛏️ por <a href="https://www.sipofcode.com">Lucas</a>, con ayuda de las IA.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.42/vue.global.prod.min.js"
  integrity="sha512-PREsKi18CyKMgwXMJWtvkzinqjiN0znVfDovmVadp7pKiUpyNGtq7bD2fKElDBmdfH4DGJz8pmAdgihN8NZ8TQ=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"
  integrity="sha512-H1ODGphQHeuWsyCj3RfmBr+Dgwg2HaEJB7x8/EPlaVZgw2Jf4O/XLp85CD9vXlgM5ywtq5LiBmL4FKFkhNJFsQ=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
const { createApp, ref, nextTick, watch } = Vue;

const KEY = 'rubber-ducky-messages';
const SHARE_SEED = 'Patito, tengo un problema...';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = (m) => { try { localStorage.setItem(KEY, JSON.stringify(m)); } catch {} };
const time = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

function getQueryParam(param) {
  return new URLSearchParams(window.location.search).get(param);
}

function party() {
  if (typeof confetti !== 'function') return;
  confetti({ particleCount: 90, spread: 75, origin: { y: 0.7 } });
  const end = Date.now() + 1100;
  (function frame() {
    confetti({ particleCount: 3, angle: 60, spread: 60, origin: { x: 0, y: 0.7 } });
    confetti({ particleCount: 3, angle: 120, spread: 60, origin: { x: 1, y: 0.7 } });
    if (Date.now() < end) requestAnimationFrame(frame);
  })();
}

createApp({
  setup() {
    const seed = getQueryParam('m');
    const messages    = ref(seed !== null ? [{ id: 1, text: seed, time: time() }] : load());
    const draft       = ref('');
    const isTyping    = ref(false);
    const celebrating = ref(false);
    const leaving = ref(false);
    const shared      = ref(false);
    const chatWindow  = ref(null);
    const inputRef    = ref(null);
    let   id          = messages.value.length;
    let   timer       = null;

    watch(messages, save, { deep: true });

    async function scrollToBottom() {
      await nextTick();
      if (chatWindow.value) chatWindow.value.scrollTop = chatWindow.value.scrollHeight;
    }

    function autoResize(e) {
      e.target.style.height = 'auto';
      e.target.style.height = e.target.scrollHeight + 'px';
    }

    function sendMessage() {
      const text = draft.value.trim();
      if (!text) return;
      messages.value.push({ id: ++id, text, time: time() });
      draft.value = '';
      if (inputRef.value) inputRef.value.style.height = 'auto';
      scrollToBottom();
      clearTimeout(timer);
      isTyping.value = true;
      timer = setTimeout(() => { isTyping.value = false; }, 1000 + Math.random() * 800);
    }

    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // ¡Lo resolví!: los globitos hacen fade out en medio segundo
    // y recién después llegan el confeti y el vaciado.
    async function resolved() {
      if (celebrating.value) return;
      celebrating.value = true;
      leaving.value = true;
      await wait(500);
      party();
      setTimeout(() => {
        messages.value = [];
        celebrating.value = false;
        leaving.value = false;
        clearTimeout(timer);
        isTyping.value = false;
      }, 1200);
    }

    function share() {
      const url = `${window.location.origin}${window.location.pathname}?m=${encodeURIComponent(SHARE_SEED)}`;
      navigator.clipboard.writeText(url);
      shared.value = true;
      setTimeout(() => { shared.value = false; }, 1500);
    }

    function reset() {
      messages.value = [];
      localStorage.removeItem(KEY);
      history.replaceState(null, '', window.location.pathname);
    }

    scrollToBottom();

    return { messages, draft, isTyping, celebrating, leaving, shared, chatWindow, inputRef, sendMessage, autoResize, resolved, share, reset };
  }
}).mount('#app');
</script>

<script>
// theme toggle: Bootstrap's native data-bs-theme, remembered per browser
(() => {
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');
  const stored = localStorage.getItem('theme');
  const initial = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const apply = (t) => { root.setAttribute('data-bs-theme', t); btn.textContent = t === 'dark' ? '☀️' : '🌙'; };
  apply(initial);
  btn.addEventListener('click', () => {
    const next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    apply(next);
  });
})();
</script>
</body>
</html>
