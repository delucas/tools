<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Lucas Videla">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%26%23x1f522%3B%3C/text%3E%3C/svg%3E">
  <title>Sudoku6 — Sudoku de 6×6</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <style>
    #tablero {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      max-width: 420px;
      margin: 0 auto;
      border: 2px solid var(--bs-border-color);
      border-radius: .375rem;
      overflow: hidden;
    }
    #tablero button {
      aspect-ratio: 1;
      font-size: 1.4rem;
      border: 0;
      border-radius: 0;
      background: var(--bs-body-bg);
      color: var(--bs-body-color);
      border-right: 1px solid var(--bs-border-color);
      border-bottom: 1px solid var(--bs-border-color);
      padding: 0;
      min-width: 0;
    }
    #tablero button.borde-caja-d { border-right: 2px solid var(--bs-secondary); }
    #tablero button.borde-caja-b { border-bottom: 2px solid var(--bs-secondary); }
    #tablero button.pista { font-weight: 700; background: var(--bs-secondary-bg); }
    #tablero button.sel { outline: 3px solid var(--bs-primary); outline-offset: -3px; }
    #tablero button.cerca { background: color-mix(in srgb, var(--bs-primary-bg-subtle) 30%, var(--bs-body-bg)); }
    #tablero button.mismo { background: var(--bs-info-bg-subtle); font-weight: 700; }
    #tablero button.mal { color: var(--bs-danger); background: var(--bs-danger-bg-subtle); }
    #tablero .notas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      font-size: .55rem;
      line-height: 1.2;
      color: var(--bs-secondary);
      width: 100%;
      height: 100%;
      align-content: center;
    }
    #pad button { font-size: 1.25rem; min-height: 3rem; font-variant-numeric: tabular-nums; }
    .alert-flotante { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 1050; max-width: min(92vw, 560px); margin-bottom: 0; box-shadow: var(--bs-box-shadow); }
    p.signature { font-size: 0.8em; }
  </style>
</head>
<body>

  <main class="container py-4" style="max-width: 640px;">
    <a href="../" class="d-inline-block mb-2 text-body-secondary small text-decoration-none">← Todas las herramientas</a>

    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">🔢 Sudoku6</h1>
        <p class="text-body-secondary mb-0">Sudoku chico y tranquilo: del 1 al 6, a tu ritmo.</p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button id="reset" class="btn btn-outline-secondary btn-sm" type="button">🗑️ Reiniciar</button>
        <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" type="button">🌙</button>
      </div>
    </div>

    <div id="notice" class="alert alert-success py-2 alert-flotante d-none" role="status"></div>

    <section class="card mb-3">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
          <div class="btn-group" role="group" aria-label="Dificultad">
            <button class="btn btn-sm btn-nivel" data-nivel="facil" type="button">Fácil</button>
            <button class="btn btn-sm btn-nivel" data-nivel="media" type="button">Media</button>
            <button class="btn btn-sm btn-nivel" data-nivel="dificil" type="button">Difícil</button>
          </div>
          <button id="notas-btn" class="btn btn-sm btn-outline-secondary" type="button" aria-pressed="false">✏️ Notas: off</button>
        </div>
        <div id="tablero" role="grid" aria-label="Tablero de sudoku 6 por 6"></div>
        <div id="pad" class="d-flex flex-wrap justify-content-center gap-2 mt-3">
          <button class="btn btn-outline-primary" data-d="1" type="button">1</button>
          <button class="btn btn-outline-primary" data-d="2" type="button">2</button>
          <button class="btn btn-outline-primary" data-d="3" type="button">3</button>
          <button class="btn btn-outline-primary" data-d="4" type="button">4</button>
          <button class="btn btn-outline-primary" data-d="5" type="button">5</button>
          <button class="btn btn-outline-primary" data-d="6" type="button">6</button>
          <button id="borrar" class="btn btn-outline-danger" type="button" title="Borrar (Supr)">⌫</button>
        </div>
        <p class="form-text mt-2 mb-0">Elegí una casilla y escribí con la botonera o el teclado (1–6, flechas, <kbd>N</kbd> notas, <kbd>Supr</kbd> borra).</p>
      </div>
    </section>

    <hr>

    <p class="signature text-body-secondary">Hecho con ❤️ y ⛏️ por <a href="https://www.sipofcode.com">Lucas</a>, con ayuda de las IA.</p>
  </main>

  <script>
    const STORAGE_KEY = 'sudoku6';
    const PISTAS = { facil: 22, media: 18, dificil: 14 };
    const NOMBRES = { facil: 'Fácil', media: 'Media', dificil: 'Difícil' };

    // Patrón base válido (filas, columnas y cajas 2×3 con 1–6).
    function grillaBase() {
      return [
        1, 2, 3, 4, 5, 6,
        4, 5, 6, 1, 2, 3,
        2, 3, 1, 5, 6, 4,
        5, 6, 4, 2, 3, 1,
        3, 1, 2, 6, 4, 5,
        6, 4, 5, 3, 1, 2,
      ];
    }

    function unidades() {
      const us = [];
      for (let r = 0; r < 6; r++) us.push([0, 1, 2, 3, 4, 5].map((c) => r * 6 + c));
      for (let c = 0; c < 6; c++) us.push([0, 1, 2, 3, 4, 5].map((r) => r * 6 + c));
      for (let br = 0; br < 3; br++) for (let bc = 0; bc < 2; bc++) {
        const u = [];
        for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) u.push((br * 2 + r) * 6 + bc * 3 + c);
        us.push(u);
      }
      return us;
    }
    const UNIDADES = unidades();

    function esGrillaValida(g) {
      const ok = (u) => {
        const v = u.map((i) => g[i]).sort();
        return v.join('') === '123456';
      };
      return UNIDADES.every(ok);
    }

    // Índices pares (misma fila, columna o caja, sin la propia).
    function pares(i) {
      const r = i / 6 | 0, c = i % 6, s = new Set();
      for (let k = 0; k < 6; k++) { s.add(r * 6 + k); s.add(k * 6 + c); }
      const br = r / 2 | 0, bc = c / 3 | 0;
      for (let dr = 0; dr < 2; dr++) for (let dc = 0; dc < 3; dc++) s.add((br * 2 + dr) * 6 + bc * 3 + dc);
      s.delete(i);
      return [...s];
    }

    function permutar(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.random() * (i + 1) | 0;
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }

    // Solución completa: transformaciones que preservan validez sobre el patrón base.
    function solucionMezclada() {
      const dig = permutar([1, 2, 3, 4, 5, 6]);
      const bandas = permutar([[0, 1], [2, 3], [4, 5]]);
      const pilas = permutar([[0, 1, 2], [3, 4, 5]]);
      const filas = bandas.map((b) => permutar(b.slice()));
      const cols = pilas.map((p) => permutar(p.slice()));
      const base = grillaBase(), sol = new Array(36);
      for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) {
        sol[r * 6 + c] = dig[base[filas[r / 2 | 0][r % 2] * 6 + cols[c / 3 | 0][c % 3]] - 1];
      }
      return sol;
    }

    // Cuenta soluciones (hasta limite) por backtracking.
    function resolverContar(grid, limite) {
      const g = grid.slice();
      let n = 0;
      const paso = () => {
        if (n >= limite) return;
        let idx = -1;
        for (let i = 0; i < 36; i++) if (!g[i]) { idx = i; break; }
        if (idx < 0) { n++; return; }
        const r = idx / 6 | 0, c = idx % 6;
        const usados = new Set();
        for (let k = 0; k < 6; k++) { usados.add(g[r * 6 + k]); usados.add(g[k * 6 + c]); }
        const br = r / 2 | 0, bc = c / 3 | 0;
        for (let dr = 0; dr < 2; dr++) for (let dc = 0; dc < 3; dc++) usados.add(g[(br * 2 + dr) * 6 + bc * 3 + dc]);
        for (let v = 1; v <= 6; v++) {
          if (usados.has(v)) continue;
          g[idx] = v;
          paso();
          g[idx] = 0;
          if (n >= limite) return;
        }
      };
      paso();
      return n;
    }

    // Excava pares simétricos aceptando solo unicidad; reintenta con otra mezcla si no llega.
    function generar(nivel) {
      const meta = PISTAS[nivel] || PISTAS.media;
      for (let intento = 0; intento < 200; intento++) {
        const solucion = solucionMezclada();
        const pistas = solucion.slice();
        let puestas = 36;
        const orden = permutar([...Array(18).keys()]);
        for (const k of orden) {
          if (puestas <= meta) break;
          const a = k, b = 35 - k;
          const sa = pistas[a], sb = pistas[b];
          pistas[a] = 0; pistas[b] = 0;
          if (resolverContar(pistas, 2) !== 1) { pistas[a] = sa; pistas[b] = sb; }
          else puestas -= (a === b ? 1 : 2);
        }
        if (puestas === meta) return { pistas, solucion };
      }
      const solucion = solucionMezclada();
      return { pistas: solucion.slice(), solucion };
    }

    // Índices en conflicto (duplicados en alguna unidad, sin impedir nada).
    function conflictos(celdas) {
      const mal = new Set();
      for (const u of UNIDADES) {
        const vistos = new Map();
        for (const i of u) {
          const v = celdas[i];
          if (!v) continue;
          if (vistos.has(v)) { mal.add(i); mal.add(vistos.get(v)); }
          else vistos.set(v, i);
        }
      }
      return mal;
    }

    // Al fijar un número, ese candidato sale de la celda y sus pares.
    function limpiarNotas(notas, idx, v) {
      for (const p of [idx, ...pares(idx)]) {
        notas[p] = notas[p].filter((x) => x !== v);
      }
    }

    function esVictoria(pistas, valores) {
      for (let i = 0; i < 36; i++) {
        if (!pistas[i] && !valores[i]) return false;
      }
      const celdas = pistas.map((p, i) => p || valores[i]);
      return conflictos(celdas).size === 0;
    }

    const $ = (id) => document.getElementById(id);
    const tablero = $('tablero'), notice = $('notice'), notasBtn = $('notas-btn');
    let noticeTimer;

    function avisar(texto, ms) {
      notice.textContent = texto;
      notice.classList.remove('d-none');
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => notice.classList.add('d-none'), ms || 4000);
    }

    function estadoValido(s) {
      if (!s || typeof s !== 'object' || !PISTAS[s.nivel]) return false;
      for (const k of ['pistas', 'valores']) {
        if (!Array.isArray(s[k]) || s[k].length !== 36) return false;
        if (!s[k].every((x) => Number.isInteger(x) && x >= 0 && x <= 6)) return false;
      }
      if (!Array.isArray(s.notas) || s.notas.length !== 36) return false;
      if (!s.notas.every((n) => Array.isArray(n) && n.every((x) => x >= 1 && x <= 6))) return false;
      return typeof s.terminado === 'boolean';
    }

    function leerEstado() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const s = JSON.parse(raw);
          if (estadoValido(s)) return s;
        }
      } catch {}
      return null;
    }

    function partidaNueva(nivel) {
      const g = generar(nivel);
      return {
        nivel, pistas: g.pistas, solucion: g.solucion,
        valores: new Array(36).fill(0),
        notas: Array.from({ length: 36 }, () => []),
        terminado: false,
      };
    }

    let state = leerEstado();
    if (!state) {
      state = partidaNueva('facil');
      persist();
    }
    let sel = -1;
    let modoNotas = false;

    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    }

    function celdas() {
      return state.pistas.map((p, i) => p || state.valores[i]);
    }

    function hayProgreso() {
      return !state.terminado && (state.valores.some((v) => v) || state.notas.some((n) => n.length));
    }

    function pintar() {
      const cs = celdas();
      const mal = conflictos(cs);
      const selNum = sel >= 0 ? cs[sel] : 0;
      const rel = new Set(sel >= 0 ? [sel, ...pares(sel)] : []);
      tablero.innerHTML = '';
      for (let i = 0; i < 36; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('role', 'gridcell');
        const r = i / 6 | 0, c = i % 6;
        if (c === 2) btn.classList.add('borde-caja-d');
        if (r === 1 || r === 3) btn.classList.add('borde-caja-b');
        const v = cs[i];
        if (state.pistas[i]) {
          btn.classList.add('pista');
          btn.textContent = v;
          btn.setAttribute('aria-label', `Pista ${v}, fila ${r + 1} columna ${c + 1}`);
        } else if (v) {
          btn.textContent = v;
          btn.setAttribute('aria-label', `${v}, fila ${r + 1} columna ${c + 1}`);
        } else if (state.notas[i].length) {
          const mini = document.createElement('span');
          mini.className = 'notas';
          mini.setAttribute('aria-hidden', 'true');
          for (let d = 1; d <= 6; d++) {
            const s = document.createElement('span');
            s.textContent = state.notas[i].includes(d) ? d : '';
            mini.append(s);
          }
          btn.append(mini);
          btn.setAttribute('aria-label', `Vacía con notas, fila ${r + 1} columna ${c + 1}`);
        } else {
          btn.setAttribute('aria-label', `Vacía, fila ${r + 1} columna ${c + 1}`);
        }
        if (i === sel) btn.classList.add('sel');
        else if (selNum && v === selNum) btn.classList.add('mismo');
        else if (rel.has(i)) btn.classList.add('cerca');
        if (mal.has(i)) btn.classList.add('mal');
        btn.addEventListener('click', () => { sel = i; pintar(); });
        tablero.append(btn);
      }
      document.querySelectorAll('.btn-nivel').forEach((b) => {
        const on = b.dataset.nivel === state.nivel;
        b.classList.toggle('btn-primary', on);
        b.classList.toggle('btn-outline-primary', !on);
      });
      notasBtn.textContent = modoNotas ? '✏️ Notas: on' : '✏️ Notas: off';
      notasBtn.classList.toggle('btn-primary', modoNotas);
      notasBtn.classList.toggle('btn-outline-secondary', !modoNotas);
      notasBtn.setAttribute('aria-pressed', modoNotas);
    }

    function escribir(d) {
      if (sel < 0 || state.terminado || state.pistas[sel]) return;
      if (modoNotas) {
        const n = state.notas[sel];
        state.notas[sel] = n.includes(d) ? n.filter((x) => x !== d) : [...n, d].sort();
      } else {
        state.valores[sel] = d;
        limpiarNotas(state.notas, sel, d);
        if (esVictoria(state.pistas, state.valores)) {
          state.terminado = true;
          avisar(`🎉 ¡Sudoku completo en ${NOMBRES[state.nivel]}! Empezá uno nuevo cuando quieras.`, 6000);
        }
      }
      persist();
      pintar();
    }

    function borrar() {
      if (sel < 0 || state.terminado || state.pistas[sel]) return;
      state.valores[sel] = 0;
      persist();
      pintar();
    }

    function alternarNotas() {
      modoNotas = !modoNotas;
      pintar();
    }

    document.querySelectorAll('#pad [data-d]').forEach((b) => {
      b.addEventListener('click', () => escribir(Number(b.dataset.d)));
    });
    $('borrar').addEventListener('click', borrar);
    notasBtn.addEventListener('click', alternarNotas);

    function moverSel(dr, dc) {
      if (sel < 0) { sel = 0; pintar(); return; }
      const r = Math.min(5, Math.max(0, (sel / 6 | 0) + dr));
      const c = Math.min(5, Math.max(0, (sel % 6) + dc));
      sel = r * 6 + c;
      pintar();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '6') escribir(Number(e.key));
      else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); borrar(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moverSel(-1, 0); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); moverSel(1, 0); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); moverSel(0, -1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); moverSel(0, 1); }
      else if (e.key === 'n' || e.key === 'N') alternarNotas();
      else if (e.key === 'Escape') { sel = -1; pintar(); }
      else return;
    });

    // Nueva partida: directo si terminó o no hay progreso; si no, en dos toques.
    const resetBtn = $('reset');
    let armada = false, armaTimer, pendiente = null;
    function desarmar() {
      armada = false;
      pendiente = null;
      resetBtn.textContent = '🗑️ Reiniciar';
      resetBtn.classList.remove('btn-danger');
      resetBtn.classList.add('btn-outline-secondary');
    }
    function pedirNueva(nivel) {
      avisar('Generando…');
      setTimeout(() => {
        state = partidaNueva(nivel || state.nivel);
        sel = -1;
        persist();
        desarmar();
        pintar();
      }, 30);
    }
    function solicitarNueva(nivel) {
      if (state.terminado || !hayProgreso()) { pedirNueva(nivel); return; }
      if (!armada) {
        armada = true;
        pendiente = nivel || state.nivel;
        resetBtn.textContent = '¿Seguro? Tocá de nuevo';
        resetBtn.classList.remove('btn-outline-secondary');
        resetBtn.classList.add('btn-danger');
        clearTimeout(armaTimer);
        armaTimer = setTimeout(desarmar, 5000);
        return;
      }
      clearTimeout(armaTimer);
      pedirNueva(pendiente || nivel);
    }
    resetBtn.addEventListener('click', () => solicitarNueva());

    document.querySelectorAll('.btn-nivel').forEach((b) => {
      b.addEventListener('click', () => {
        if (b.dataset.nivel === state.nivel && !state.terminado && !hayProgreso()) return;
        solicitarNueva(b.dataset.nivel);
      });
    });

    // theme toggle: Bootstrap's native data-bs-theme, remembered per browser
    (() => {
      const root = document.documentElement;
      const btn = document.getElementById('theme-toggle');
      const leer = () => { try { return localStorage.getItem('theme'); } catch { return null; } };
      const guardar = (t) => { try { localStorage.setItem('theme', t); } catch {} };
      const initial = leer() || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const apply = (t) => { root.setAttribute('data-bs-theme', t); btn.textContent = t === 'dark' ? '☀️' : '🌙'; };
      apply(initial);
      btn.addEventListener('click', () => {
        const next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        guardar(next);
        apply(next);
      });
    })();

    if (state.terminado) avisar('Partida completada. Empezá una nueva cuando quieras.', 6000);
    pintar();
  </script>
</body>
</html>
